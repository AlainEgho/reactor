# Publish the web game to GitHub Pages at robomind.app (custom domain in CNAME).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site/icons
          cp index.html play.html privacy.html gamedata.txt manifest.webmanifest sw.js CNAME .nojekyll site/
          cp icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png site/icons/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
