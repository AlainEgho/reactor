<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fission</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen console - status strip on top, scrolling reactor-floor playfield, touch pad below on phones; menus float over the playfield */
:root{
  --void:#05070a;
  --bg:#0a0d12;
  --panel:#11161e;
  --line:#232b38;
  --fg:#e3e7ee;
  --muted:#8b94a5;
  --hero:#f5c518;
  --hero-soft:rgba(245,197,24,.16);
  --fuel:#86f06a;
  --core:#4fb8ff;
  --alarm:#e5402f;
  --go:#4fd27a;
  --amber:#f2b23a;
  --scrim:rgba(5,7,10,.82);
  --display:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-bottom:10px;border-bottom:2px solid var(--wing,var(--line));transition:border-color .4s}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.brand .catname{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--wing,var(--muted));white-space:nowrap}
.brand .catname:empty{display:none}
.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.16em}
.logo{display:inline-flex;align-items:center;gap:.4em}
.tre{width:.95em;height:.95em;fill:var(--hero);flex:none}
.lvl{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stats{display:flex;gap:22px}
.stat{display:grid;grid-template-rows:auto auto;grid-auto-flow:column;column-gap:8px;row-gap:2px;align-items:center}
.stat .ico{grid-row:span 2;width:28px;height:28px;border-radius:5px;border:1px solid var(--line)}
#sNeed.open{animation:sweep .4s ease-out}
@keyframes sweep{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.stat .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;transform-origin:left center}
.bump{animation:bump .3s ease-out}
@keyframes bump{from{transform:scale(1.15)}to{transform:scale(1)}}
#sScore{color:var(--hero)}
.combo{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;background:var(--hero);color:#16140c;font-size:12px;font-weight:700;vertical-align:middle;animation:combo .25s ease-out}
@keyframes combo{from{transform:scale(1.6)}to{transform:scale(1)}}
.lv .meta b{color:var(--hero);font-weight:600}
.total{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.total b{color:var(--hero);font-size:16px;letter-spacing:0;font-variant-numeric:tabular-nums}
.tally{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:center;font-size:13px;color:var(--muted);text-align:left}
.tally b{color:var(--fg);font-variant-numeric:tabular-nums;text-align:right}
.tally .sum b{color:var(--hero);font-size:18px}
.tally .new{color:var(--fuel)}
.tally b.on{color:var(--hero)}
.tally b.off{color:var(--line)}
.stars{letter-spacing:.04em;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}
.stars i.on{color:var(--hero)}
#sNeed{color:var(--fuel)}
#sNeed.open{color:var(--core)}
#sTime.low,#sAir.low,#sDose.low{color:var(--alarm);animation:blink .6s steps(2) infinite}
@keyframes blink{to{opacity:.35}}
.meltcard h3{font-family:var(--display);font-size:20px;letter-spacing:.08em;margin:0;color:var(--alarm)}
.meltcard p b{color:var(--fg)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--hero);border-color:var(--hero);color:#16140c}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.stage{position:relative;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--void)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--scrim);overflow:auto}
.panel{width:100%;max-width:780px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px}
.panel.small{max-width:420px;align-items:center;text-align:center}
.panel h2{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.08em;margin:0;text-wrap:balance}
.panel p{margin:0;line-height:1.55;color:var(--muted);font-size:13px;max-width:60ch}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mark{display:flex;flex-direction:column;gap:4px}
.mark span{font-family:var(--display);font-size:clamp(34px,7vw,54px);font-weight:700;letter-spacing:.2em;line-height:1}
.mark span{display:inline-flex;align-items:center;gap:.3em}
.mark small{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lv{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:2px;align-items:baseline;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;min-width:0}
.lv:hover{border-color:var(--hero)}
.lv{border-left:3px solid var(--wing,var(--line))}
.lv{transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.lv:hover,.lv:focus-visible{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.mark .tre{animation:tre-spin 30s linear infinite}
.panel{box-shadow:0 24px 60px rgba(0,0,0,.55)}
@keyframes tre-spin{to{transform:rotate(360deg)}}
.menubar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cat{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;border-radius:10px;border:1px solid var(--line);border-top:4px solid var(--wing);background:linear-gradient(180deg,var(--wing-bg),var(--bg) 75%);color:var(--fg);font-family:var(--mono);cursor:pointer;min-width:0;transition:transform .16s ease,border-color .16s ease}
.cat:hover,.cat:focus-visible{transform:translateY(-2px);border-color:var(--wing)}
.cat .range{font-size:11px;letter-spacing:.14em;color:var(--wing);font-variant-numeric:tabular-nums}
.cat .cname{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.06em}
.cat .blurb{font-size:12px;line-height:1.45;color:var(--muted);min-height:2.9em}
.cat .prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:auto}
.cat .prog i{display:block;height:100%;background:var(--wing)}
.cat .cmeta{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.cat .cmeta .bonus{font-style:normal;color:#d8d8e6}
.lv.bonus{border-left-color:#d8d8e6}
.lv.bonus .num::after{content:'B';font-size:11px;margin-left:3px;color:#d8d8e6;vertical-align:top}
.cathead.bonus{margin-top:8px}
.cat.full .cmeta{color:var(--go)}
.cathead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding-bottom:10px;border-bottom:2px solid var(--wing)}
.cathead h3{margin:0;font-family:var(--display);font-size:22px;letter-spacing:.08em;color:var(--wing)}
.cathead span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.mark .tre{animation:none}.lv,.lv:hover,.cat,.cat:hover{transition:none;transform:none}}
.lv .num{grid-row:span 2;font-family:var(--display);font-size:24px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.lv.cleared .num{color:var(--go)}
.lv.locked{opacity:.42;cursor:not-allowed;border-left-color:var(--line)}
.lv.locked:hover{transform:none;box-shadow:none;border-color:var(--line)}
.lock{display:inline-block;position:relative;width:8px;height:7px;margin:0 6px 0 1px;top:1px;border-radius:1px;background:currentColor}
.lock::before{content:'';position:absolute;left:1px;top:-5px;width:6px;height:6px;box-sizing:border-box;border:1.5px solid currentColor;border-bottom:0;border-radius:3px 3px 0 0}
.code{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.code input{flex:0 1 220px;min-width:0;font-family:var(--mono);font-size:13px;letter-spacing:.08em;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.code input:focus{outline:none;border-color:var(--hero)}
.code.done{color:var(--go);margin:0}
.mark small.who{letter-spacing:.06em;text-transform:none;font-size:12px}
.mark small.who b{color:var(--fg)}
.login{gap:18px}
.login .mark span{font-size:clamp(30px,8vw,44px)}
.loginform{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.loginform label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.loginform input{font-family:var(--mono);font-size:16px;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.loginform input:focus{outline:none;border-color:var(--hero)}
.loginform .btn{padding:12px;font-size:13px}
.lv .name{font-size:14px;font-weight:600;min-width:0}
.lv .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.levels.dense{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.levels.dense .lv{padding:9px 11px;column-gap:9px}
.levels.dense .num{font-size:18px}
.levels.dense .name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:9px;background:var(--bg);align-self:flex-start;flex-wrap:wrap}
.tab{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:6px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.loadcard{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:18px;border:1px dashed var(--line);border-radius:10px;background:var(--bg)}
.loadcard.drag{border-color:var(--amber)}
.loadcard code{font-family:var(--mono);color:var(--fg)}
.err{color:var(--alarm);font-size:12px}
.loadcard .fine{font-size:11px;color:var(--muted);opacity:.8}
.setbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:11px;color:var(--muted)}
.linkbtn{font-family:var(--mono);font-size:11px;background:none;border:0;padding:0;color:var(--amber);text-decoration:underline;cursor:pointer}
.cat .mini{display:block;width:100%;aspect-ratio:18/7;border-radius:6px;border:1px solid var(--line);margin-bottom:4px;image-rendering:auto}
.cat .newparts{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.cat .newparts small{width:100%;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cat .newparts canvas{width:26px;height:26px;border-radius:4px;border:1px solid var(--line)}
.cat .newparts em{font-style:normal;font-size:11px;color:var(--wing);margin-left:2px}
.partsintro{font-size:12px}
.partgroup{display:flex;flex-direction:column;gap:10px}
.partgroup h3{display:flex;align-items:baseline;gap:10px;margin:0;padding-bottom:6px;border-bottom:2px solid var(--wing);font-family:var(--display);font-size:18px;letter-spacing:.08em;color:var(--wing)}
.partgroup h3 span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px}
.part{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid var(--line);border-left:3px solid var(--wing);background:var(--bg)}
.part canvas{width:56px;height:56px;flex:none;border-radius:6px}
.part .ptext{display:flex;flex-direction:column;gap:4px;min-width:0}
.part b{font-size:14px}
.panel .part p{font-size:12px;line-height:1.45;max-width:none}
.part .linkbtn{align-self:flex-start;text-align:left}
.keys{font-size:11px;color:var(--muted);letter-spacing:.02em;margin:0;line-height:1.9}
.keys kbd{margin:0 1px}
.keys kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--fg)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--wing,var(--line));border-radius:8px;padding:9px 14px;font-size:12px;line-height:1.45;color:var(--fg);pointer-events:none;transition:opacity .5s}
.toast::before{content:attr(data-lvl);font-family:var(--display);font-weight:700;letter-spacing:.08em;color:var(--wing,var(--hero));margin-right:10px}
.toast[data-lvl=""]::before{display:none}
.toast.gone{opacity:0}
.pad{display:none}
@media (pointer:coarse){
  .pad{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .app>.keys{display:none}
}
.pad{padding-bottom:env(safe-area-inset-bottom,0px)}
.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:6px}
.dpad button{border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button,.act{transition:transform .08s,background .08s}
.dpad button.on,.act.on{background:var(--line);transform:scale(.94)}
.act{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.act .tre{width:22px;height:22px}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.act{width:86px;height:86px;border-radius:50%;border:2px solid var(--hero);background:var(--hero-soft);color:var(--fg);font-size:11px;letter-spacing:.1em;text-transform:uppercase;touch-action:none;user-select:none;-webkit-user-select:none}
.acts{display:flex;gap:14px;align-items:flex-end}
.act.boost{width:68px;height:68px;border-color:var(--core);background:rgba(79,184,255,.14)}
.act.boost:disabled{opacity:.35}
#sGad{color:var(--core)}
#sShield.on{color:var(--core)}
.backbar{align-self:stretch;text-align:left;padding:10px 14px;border-color:var(--wing,var(--line));color:var(--fg)}
/* Phones: the menu takes the whole screen, with a short top, one row of tabs, Continue first, row cards
   for the categories and two level cards to a row. Dialogs stay centred. */
@media (max-width:560px){
  .overlay{position:fixed;inset:0;padding:0;z-index:5} /* above the pad and the header */
  .overlay:has(.panel:not(.small)){place-items:start stretch}
  .menubar .btn:not(.primary){display:none} /* the Components tab is right above */
  .panel:not(.small){max-width:none;min-height:100%;border:0;border-radius:0;box-shadow:none;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));gap:12px}
  .panel.small{width:auto;margin:16px;max-width:calc(100% - 32px)}
  .mark span{font-size:26px}
  .mark small{font-size:10px}
  .panel:not(.small)>p:not(.partsintro){display:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;align-self:stretch;padding:3px}
  .tab{padding:9px 2px;font-size:10px;letter-spacing:.02em;text-align:center}
  .tab .n{display:none}
  .menubar{flex-direction:column;align-items:stretch;gap:8px}
  .menubar .row{flex-direction:column-reverse}
  .menubar .btn{padding:12px;font-size:13px}
  .cats{grid-template-columns:1fr;gap:8px}
  .cat{display:grid;grid-template-columns:88px 1fr;column-gap:12px;row-gap:3px;padding:10px;border-top-width:1px;border-left:4px solid var(--wing);align-items:start}
  .cat .mini{grid-row:1/span 5;width:88px;height:88px;aspect-ratio:auto;object-fit:cover;margin:0}
  .cat .cname{font-size:16px}
  .cat .blurb{min-height:0;font-size:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cat .newparts{display:none}
  .cat .prog{margin-top:2px}
  .cathead h3{font-size:18px}
  .levels,.levels.dense{grid-template-columns:repeat(2,1fr);gap:8px}
  .lv,.levels.dense .lv{padding:8px 10px;column-gap:8px}
  .lv .num,.levels.dense .num{font-size:17px}
  .lv .name,.levels.dense .name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv .meta{font-size:10px}
  .code input{font-size:16px;flex:1 1 auto} /* 16px keeps a phone from zooming in on focus */
  .part{padding:8px 10px;gap:10px}
  .part canvas{width:44px;height:44px}
  /* One line: the trefoil, the level number, the counters, and icon buttons. */
  .bar{flex-wrap:nowrap;gap:8px;padding-bottom:6px}
  .brand{gap:8px;flex:0 0 auto;align-items:center}
  .logo{font-size:18px}
  .logo .word,.brand .catname,.lvl{display:none}
  .stats{flex:1 1 auto;min-width:0;justify-content:center;gap:9px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stat{column-gap:4px;flex:0 0 auto}
  .stat .k{display:none}
  .stat .v{font-size:15px;white-space:nowrap}
  .stat .ico{width:20px;height:20px}
  .tools{flex:0 0 auto;gap:4px;flex-wrap:nowrap}
  .tools .btn{width:31px;height:31px;padding:0;font-size:0;display:inline-flex;align-items:center;justify-content:center}
  .tools .btn::before{font-size:16px;line-height:1}
  #bLevels::before{content:'\2261'}
  #bRestart::before{content:'\21BB'}
  #bSound::before{content:'\266A'}
  #bMusic::before{content:'\266B'}
  #bSound[aria-pressed="false"]::before,#bMusic[aria-pressed="false"]::before{opacity:.4;text-decoration:line-through}
}
/* Narrow phones: the pad shrinks to fit beside both thumbs. */
@media (max-width:480px){
  .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
  .act{width:76px;height:76px}
  .act.boost{width:60px;height:60px}
}
/* Moments: the level intro strip, the board's state behind a dialog, and how dialogs arrive. */
.intro{position:absolute;left:0;right:0;top:22%;display:flex;flex-direction:column;gap:5px;padding:14px 26px;background:rgba(10,13,18,.9);border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-left:6px solid var(--wing,var(--hero));pointer-events:none;animation:intro-in .22s ease-out;transition:opacity .2s}
.intro b{font-family:var(--display);font-size:clamp(22px,4vw,34px);letter-spacing:.08em;line-height:1}
.intro span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--wing,var(--muted))}
.intro.out{opacity:0}
@keyframes intro-in{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
#cv{transition:filter .6s}
#cv.dead{filter:saturate(.3) contrast(1.1)}
#cv.paused{filter:blur(4px)}
.panel{animation:panel-in .18s ease-out}
.panel.pop{animation:panel-pop .18s ease-out}
.panel.rise{animation:panel-rise .26s ease-out}
.panel.slide-l{animation:slide-l .22s ease-out}
.panel.slide-r{animation:slide-r .22s ease-out}
@keyframes slide-l{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slide-r{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes panel-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes panel-pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes panel-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.tally>*{animation:row-in .28s ease-out both;animation-delay:calc(var(--i,0)*60ms)}
.tally b.on{animation:star-pop .45s ease-out both;animation-delay:calc(var(--i,0)*60ms + .15s)}
@keyframes row-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes star-pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.toast,#cv,.bar{transition:none}.intro,.panel,.panel.pop,.panel.rise,.panel.slide-l,.panel.slide-r,.tally>*,.tally b.on,.bump,#sNeed.open,#sTime.low,#sAir.low,#sDose.low{animation:none}#sTime.low,#sAir.low,#sDose.low{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="logo"><svg class="tre" viewBox="-1 -1 2 2" aria-hidden="true"><path d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><path transform="rotate(120)" d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><path transform="rotate(240)" d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><circle r=".18"/></svg><b class="word">FISSION</b></span><span class="catname" id="lvlCat"></span><span class="lvl" id="lvlName">Level 001</span></div>
    <div class="stats">
      <div class="stat"><canvas class="ico" data-legend="pellet" width="40" height="40"></canvas><span class="k">Pellets needed</span><span class="v" id="sNeed">000</span></div>
      <div class="stat"><span class="k">Score</span><span class="v" id="sScore">0<b class="combo" id="sCombo" hidden>×2</b></span></div>
      <div class="stat" id="redStat" hidden><canvas class="ico" data-legend="red" width="40" height="40"></canvas><span class="k">Red canisters</span><span class="v" id="sRed">0</span></div>
      <div class="stat" id="gadStat" hidden><canvas class="ico" id="gadIco" data-legend="thruster" width="40" height="40"></canvas><span class="k">Gadget · Shift</span><span class="v" id="sGad">&mdash;</span></div>
      <div class="stat" id="keyStat" hidden><canvas class="ico" data-legend="keycard" width="40" height="40"></canvas><span class="k">Keycards</span><span class="v" id="sKeys">0</span></div>
      <div class="stat" id="shieldStat" hidden><canvas class="ico" data-legend="shield" width="40" height="40"></canvas><span class="k">Shield</span><span class="v" id="sShield">Off</span></div>
      <div class="stat" id="doseStat" hidden><canvas class="ico" data-legend="fallout" width="40" height="40"></canvas><span class="k">Dose</span><span class="v" id="sDose">0%</span></div>
      <div class="stat" id="airStat" hidden><canvas class="ico" data-legend="tank" width="40" height="40"></canvas><span class="k">Air</span><span class="v" id="sAir">0:00</span></div>
      <div class="stat"><span class="k">Time</span><span class="v" id="sTime">0:00</span></div>
      <div class="stat" id="gravStat" hidden><span class="k">Gravity</span><span class="v" id="sGrav">Off</span></div>
    </div>
    <div class="tools">
      <button class="btn" id="bLevels" type="button">Levels</button>
      <button class="btn" id="bRestart" type="button">Restart</button>
      <button class="btn" id="bSound" type="button" aria-pressed="true">Sound on</button>
      <button class="btn" id="bMusic" type="button" aria-pressed="true">Music on</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Fission playfield"></canvas>
    <div class="toast gone" id="toast"></div>
    <div class="intro" id="intro" hidden><b></b><span></span></div>
    <div class="overlay" id="ov" hidden></div>
  </main>
  <input type="file" id="datFile" accept=".dat,.DAT,.d00,.sp,.SP" hidden>
  <div class="pad" id="pad">
    <div class="dpad">
      <button class="u" type="button" data-dir="0" aria-label="Up">&#9650;</button>
      <button class="l" type="button" data-dir="3" aria-label="Left">&#9664;</button>
      <button class="r" type="button" data-dir="1" aria-label="Right">&#9654;</button>
      <button class="d" type="button" data-dir="2" aria-label="Down">&#9660;</button>
    </div>
    <div class="acts">
      <button class="act boost" id="bGad" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 14l7-7 7 7M5 20l7-7 7 7"/></svg><span>Gadget</span></button>
      <button class="act" id="bAct" type="button"><svg class="tre" viewBox="-1 -1 2 2" aria-hidden="true"><path d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><path transform="rotate(120)" d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><path transform="rotate(240)" d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><circle r=".18"/></svg><span>Snap · Drop</span></button>
    </div>
  </div>
  <p class="keys"><kbd>Arrows</kbd> or <kbd>WASD</kbd> move &middot; <kbd>Space</kbd> + direction snaps without moving &middot; hold <kbd>Space</kbd> to drop a red canister &middot; <kbd>Shift</kbd> + direction uses the gadget &middot; <kbd>R</kbd> restart &middot; <kbd>P</kbd> pause &middot; <kbd>M</kbd> music</p>
</div>

function cell(t){return {t:t,d:0,f:false,s:-1,mt:-1,ox:0,oy:0,timer:0,leave:EMPTY,phase:0,v:0,sp:null};}
const WALL=cell(HARD); // out-of-bounds sentinel, never written

// Original Supaplex level files (LEVELS.DAT): 1536 bytes per level, 60x24 tile codes, then a 96-byte
// header. The player supplies the file; nothing from it is stored in this page.
const DAT_LEVEL=1536,DAT_W=60,DAT_H=24;
const DAT_CODE=[
  [EMPTY],[ZONK],[BASE],[MURPHY],[INFO],[RAM],[HARD],[EXIT],[ORANGE],
  [PORT,2],[PORT,4],[PORT,8],[PORT,1],[PORT,2],[PORT,4],[PORT,8],[PORT,1],
  [SNIK],[YELLOW],[TERM],[RED],[PORT,5],[PORT,10],[PORT,15],[ELEC],[BUG],
  [RAM,0,1],[RAM,0,2],
  [HARD,0,1],[HARD,0,2],[HARD,0,3],[HARD,0,4],[HARD,0,5],[HARD,0,6],[HARD,0,7],[HARD,0,8],[HARD,0,9],[HARD,0,10],
  [RAM,0,3],[RAM,0,4],[INVIS]
];
function parseDat(bytes){
  if(!bytes||bytes.length<DAT_LEVEL||bytes.length%DAT_LEVEL!==0) throw new Error('A level file holds whole 1536-byte levels. This file is '+(bytes?bytes.length:0)+' bytes.');
  const out=[];
  for(let o=0;o<bytes.length;o+=DAT_LEVEL){
    const h=o+DAT_W*DAT_H;
    let name='';
    for(let i=6;i<29;i++) name+=String.fromCharCode(bytes[h+i]);
    name=name.replace(/^[-\s]+|[-\s]+$/g,'').replace(/\s+/g,' ')||'Level '+(out.length+1);
    const specials=[];
    for(let i=0;i<Math.min(10,bytes[h+31]);i++){
      const e=h+32+i*6,pos=((bytes[e]<<8)|bytes[e+1])>>1;
      specials.push({x:pos%DAT_W,y:Math.floor(pos/DAT_W),grav:bytes[e+2]===1,freezeZ:bytes[e+3]===2,freezeE:bytes[e+4]===1});
    }
    out.push({name:name,need:bytes[h+30],grav:bytes[h+4]===1,freezeZ:bytes[h+29]===2,specials:specials,
      W:DAT_W,H:DAT_H,codes:bytes.subarray?bytes.subarray(o,h):bytes.slice(o,h)});
  }
  return out;
}

function createGame(level){
  const fromDat=!!level.codes;
  const H=fromDat?level.H:level.map.length,W=fromDat?level.W:level.map[0].length;
  const g={W:W,H:H,cells:new Array(W*H),tick:0,need:level.need,got:0,red:0,total:0,state:'play',endTick:-1,
    pending:[],events:[],marks:[],m:{x:-1,y:-1,face:1,bomb:0,snapTick:-9,snapDir:1,teleTick:-9},pushTicks:0,pushDir:-1,holdTicks:0,termTick:-99,
    grav:!!level.grav,freezeZ:!!level.freezeZ,freezeE:false,usesGrav:!!level.grav,exitLost:false,
    gadget:null,gadLatch:false,keys:0,shield:false,shieldTick:-99,stasis:0,teles:[],
    // Element Wings: the floor under Iso, the direction he is sliding on Ice, his radiation dose and
    // iodine cover, the air left (ticks; only counted when the level sets it), lamps carried, gate flips.
    under:EMPTY,slide:-1,dose:0,iodine:0,air:level.air?Math.round(level.air*8):0,usesAir:!!level.air,dark:!!level.dark,lamp:0,gateFlips:0,switchTick:-99};
  for(let y=0;y<H;y++){
    const row=fromDat?null:level.map[y];
    if(row&&row.length!==W) throw new Error(level.name+': row '+y+' is '+row.length+' wide, expected '+W);
    for(let x=0;x<W;x++){
      let c;
      if(fromDat){
        const def=DAT_CODE[level.codes[y*W+x]]||[INVIS];
        c=cell(def[0]);if(def[0]===PORT) c.d=def[1];if(def[2]) c.v=def[2];
      }else{
        const ch=row[x];
        if(PORT_MASK[ch]){c=cell(PORT);c.d=PORT_MASK[ch];}
        else{const t=CHAR_TYPE[ch];if(t===undefined) throw new Error(level.name+': unknown tile "'+ch+'"');c=cell(t);if(ch==='i') c.d=1;if(CHAR_DIR[ch]) c.d=CHAR_DIR[ch];}
      }
      if(c.t===MURPHY&&g.m.x<0){g.m.x=x;g.m.y=y;}
      if(c.t===BUG) c.phase=(x*7+y*11)%BUG_CYCLE;
      if(c.t===LASER) c.phase=(x*5+y*7)%LASER_CYCLE;
      if(c.t===DRONE) c.phase=(x+y)&1;
      if(c.t===COOL) c.phase=(x*5+y*3)%COOL_EVERY;
      if(c.t===ISO) c.timer=HALF_LIFE;
      if(c.t===TELE) g.teles.push({x:x,y:y});
      if(c.t===INFO) g.total++;
      g.cells[y*W+x]=c;
    }
  }
  if(g.m.x<0) throw new Error(level.name+': no starting point for Iso');
  for(const s of level.specials||[]){
    const c=at(g,s.x,s.y);
    if(c.t===PORT){c.sp=s;if(s.grav) g.usesGrav=true;}
  }
  if(fromDat&&!g.need) g.need=g.total&255;
  return g;
}

function at(g,x,y){return (x<0||y<0||x>=g.W||y>=g.H)?WALL:g.cells[y*g.W+x];}
function put(g,x,y,c){g.cells[y*g.W+x]=c;}
function emit(g,e){g.events.push(e);}
function bugLive(g,c){return (g.tick+c.phase)%BUG_CYCLE<BUG_ON;}
function isRound(c){return c.t===ZONK||c.t===INFO||c.t===RAM||c.t===ROD||c.t===PLUT||c.t===ISO||c.t===ANTI;}
function isPickup(t){return t===KEY||t===SHIELD||t===ROD||t===JET||t===TRACT||t===STASIS||t===IODINE||t===NGUN||t===QTUN||t===TANK||t===LAMP;}
function isGadget(t){return t===JET||t===TRACT||t===STASIS||t===NGUN||t===QTUN;}
// Things that fall: Lead, Pellets, orange canisters, Fuel rods, Plutonium, Isotope pellets, Antipellets.
function falls(t){return t===ZONK||t===INFO||t===ORANGE||t===ROD||t===PLUT||t===ISO||t===ANTI;}
// Floors: Iso walks over them and they come back when he leaves.
function isFloor(t){return t===ICE||t===FALLOUT;}
// What kills Iso on touch and dies in a blast.
function isEnemy(t){return t===SNIK||t===DRONE||t===ALPHA;}
// Plant hardware that no blast touches.
function blastProof(t){return t===HARD||t===INVIS||t===TELE||t===DOOR||t===LASER||t===CONV||t===MAGNET||t===SWITCH||t===GATE;}
function shift(g,x,y,nx,ny){
  const c=at(g,x,y);put(g,nx,ny,c);put(g,x,y,cell(EMPTY));
  c.s=g.tick;c.mt=g.tick;c.ox=x-nx;c.oy=y-ny;return c;
}
function queue(g,x,y,info,delay){
  for(const p of g.pending) if(p.x===x&&p.y===y) return;
  g.pending.push({x:x,y:y,info:info,delay:delay});
}
function kill(g){
  if(g.state!=='play') return;
  g.state='dead';g.endTick=g.tick;g.m.bomb=0;emit(g,'die');
}

function explode(g,cx,cy,info){
  emit(g,'boom');
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const x=cx+dx,y=cy+dy;
    if(x<0||y<0||x>=g.W||y>=g.H) continue;
    const c=at(g,x,y);
    if(blastProof(c.t)) continue;
    if(c.t===EXIT&&!g.exitLost){g.exitLost=true;emit(g,'exitlost');}
    // A Shield takes one hit: Iso stands through the blast and the halo is gone. The broken halo still
    // covers the next SHIELD_GRACE ticks, so the chain blast of whatever hit Iso does not finish the job.
    if(c.t===MURPHY&&(g.shield||g.tick-g.shieldTick<SHIELD_GRACE)){
      if(g.shield){g.shield=false;g.shieldTick=g.tick;emit(g,'shieldlost');}
      continue;
    }
    if(c.t===MURPHY) kill(g);
    if(isEnemy(c.t)) g.marks.push({k:'kill',x:x,y:y});
    if(!dx&&!dy&&info) g.marks.push({k:'fission',x:x,y:y});
    if(dx||dy){
      if(c.t===ORANGE||c.t===YELLOW||c.t===BOMB||c.t===HYDRO||isEnemy(c.t)||c.t===MURPHY) queue(g,x,y,false,1);
      else if(c.t===ELEC||c.t===PLUT) queue(g,x,y,true,1);
    }
    // A fuse in the blast lights instead of burning away at once; the fire runs on from there.
    if(c.t===FUSE&&(dx||dy)){light(g,x,y);continue;}
    const e=cell(EXPL);e.timer=EXPL_TICKS;e.leave=info?INFO:EMPTY;e.s=g.tick;
    if(!dx&&!dy) e.c=1; // blast centre; only the renderer reads it
    put(g,x,y,e);
  }
}

function terminal(g){
  if(g.tick-g.termTick<4) return;
  g.termTick=g.tick;emit(g,'terminal');
  let n=0;
  for(let y=0;y<g.H;y++) for(let x=0;x<g.W;x++)
    if(g.cells[y*g.W+x].t===YELLOW) queue(g,x,y,false,1+(n++%3));
}

function walk(g,nx,ny){
  const m=g.m,c=at(g,m.x,m.y),dest=at(g,nx,ny).t;
  let left=cell(g.under);
  if(m.bomb>0){left=cell(BOMB);left.timer=m.bomb;left.s=g.tick;m.bomb=0;}
  put(g,m.x,m.y,left);put(g,nx,ny,c);
  g.under=isFloor(dest)?dest:EMPTY;
  c.s=g.tick;c.mt=g.tick;c.ox=m.x-nx;c.oy=m.y-ny;
  m.x=nx;m.y=ny;
}

function push(g,x,y,c,d,need){
  if(c.f){g.pushTicks=0;return;}
  if(g.pushDir!==d){g.pushDir=d;g.pushTicks=0;}
  if(++g.pushTicks<need) return;
  const tx=x+DX[d],ty=y+DY[d];
  if(at(g,tx,ty).t!==EMPTY) return;
  shift(g,x,y,tx,ty);walk(g,x,y);g.pushTicks=0;emit(g,'push');
}

function snap(g,x,y,c){
  switch(c.t){
    case BASE:put(g,x,y,cell(EMPTY));emit(g,'eat');break;
    case BUG:if(bugLive(g,c)) explode(g,g.m.x,g.m.y,false);else{put(g,x,y,cell(EMPTY));emit(g,'eat');}break;
    case INFO:g.got++;put(g,x,y,cell(EMPTY));emit(g,'collect');break;
    case RED:g.red++;put(g,x,y,cell(EMPTY));emit(g,'collect');break;
    case TERM:terminal(g);break;
    case FUSE:put(g,x,y,cell(EMPTY));emit(g,'eat');break;
    case ISO:g.got+=ISO_WORTH;put(g,x,y,cell(EMPTY));emit(g,'collect');break;
    case ANTI:g.got=Math.max(0,g.got-1);put(g,x,y,cell(EMPTY));emit(g,'anti');break;
    default:if(isPickup(c.t)){pickup(g,c);put(g,x,y,cell(EMPTY));}
  }
}

function eatable(c){return c.t===BASE||c.t===BUG||c.t===INFO||c.t===RED||c.t===FUSE||c.t===ISO||c.t===ANTI||isPickup(c.t);}

// Takes an upgrade tile Iso walked into or snapped: gadgets go in the one slot, cards and the Shield
// are kept, a Fuel rod counts as ROD_WORTH Pellets.
function pickup(g,c){
  switch(c.t){
    case JET:case TRACT:case STASIS:case NGUN:case QTUN:
      if(g.gadget&&g.gadget.k===c.t) g.gadget.n+=GADGET_CHARGES[c.t];else g.gadget={k:c.t,n:GADGET_CHARGES[c.t]};
      emit(g,'gadget');break;
    case KEY:g.keys++;emit(g,'key');break;
    case SHIELD:g.shield=true;emit(g,'shield');break;
    case ROD:g.got+=ROD_WORTH;emit(g,'collect');break;
    case IODINE:g.dose=0;g.iodine=IODINE_TICKS;emit(g,'iodine');break;
    case TANK:if(g.usesAir) g.air+=AIR_TANK;emit(g,'air');break;
    case LAMP:g.lamp++;emit(g,'lamp');break;
  }
}

// Spends one charge of the equipped gadget. Stasis needs no direction; the Thruster dashes Iso through
// empty space in direction d until something blocks; the Tractor steps Iso one cell in direction d and
// drags the Lead ball or canister behind it into the cell it left. Returns false when nothing happened.
function useGadget(g,d){
  const gd=g.gadget,m=g.m;
  if(!gd||gd.n<=0) return false;
  let used=false;
  if(gd.k===STASIS){g.stasis=STASIS_TICKS;emit(g,'stasis');used=true;}
  else if(d<0) return false;
  else if(gd.k===JET){
    let nx=m.x,ny=m.y;
    while(at(g,nx+DX[d],ny+DY[d]).t===EMPTY){nx+=DX[d];ny+=DY[d];}
    if(nx!==m.x||ny!==m.y){walk(g,nx,ny);if(d===1||d===3) m.face=d;emit(g,'dash');used=true;}
  }else if(gd.k===TRACT){
    const b=at(g,m.x-DX[d],m.y-DY[d]),f=at(g,m.x+DX[d],m.y+DY[d]);
    if(m.bomb===0&&(b.t===ZONK||b.t===ORANGE||b.t===YELLOW||b.t===CRATE||b.t===PLUT||b.t===MIRROR)&&(f.t===EMPTY||f.t===BASE)){
      const ox=m.x,oy=m.y;
      walk(g,ox+DX[d],oy+DY[d]);if(d===1||d===3) m.face=d;
      shift(g,ox-DX[d],oy-DY[d],ox,oy);b.f=false;
      if(f.t===BASE) emit(g,'eat');emit(g,'pull');used=true;
    }
  }else if(gd.k===NGUN){
    // A neutron flies along d through open space to the first thing it meets. Enemies, canisters,
    // Casks, crates and mirrors blow up; a Neutron or Plutonium is split; a fuse is lit; the rest shrugs.
    let bx=m.x,by=m.y;const path=[];
    for(let n=0;n<Math.max(g.W,g.H);n++){bx+=DX[d];by+=DY[d];const t=at(g,bx,by).t;path.push({x:bx,y:by});if(t!==EMPTY) break;}
    const t=at(g,bx,by).t;
    g.marks.push({k:'shot',cells:path});
    if(isEnemy(t)||t===ORANGE||t===YELLOW||t===RED||t===BOMB||t===HYDRO||t===RAM||t===MIRROR||t===CRATE) explode(g,bx,by,false);
    else if(t===ELEC||t===PLUT) explode(g,bx,by,true);
    else if(t===FUSE) light(g,bx,by);
    if(d===1||d===3) m.face=d;
    emit(g,'shot');used=true;
  }else if(gd.k===QTUN){
    // Tunnels through one solid cell when the cell beyond is open.
    const a=at(g,m.x+DX[d],m.y+DY[d]),b=at(g,m.x+2*DX[d],m.y+2*DY[d]);
    if(a.t!==EMPTY&&a.t!==MURPHY&&(b.t===EMPTY||b.t===BASE||isFloor(b.t))){
      walk(g,m.x+2*DX[d],m.y+2*DY[d]);if(d===1||d===3) m.face=d;g.slide=-1;
      if(b.t===BASE) emit(g,'eat');emit(g,'tunnel');used=true;
    }
  }
  if(used&&--gd.n<=0) g.gadget=null;
  return used;
}

// Lights a fuse cell: it burns FUSE_TICKS, then sets off its neighbours (see burn).
function light(g,x,y){const b=cell(BURN);b.timer=FUSE_TICKS;b.s=g.tick;put(g,x,y,b);emit(g,'fuse');}
function burn(g,x,y,c){
  if(--c.timer>0) return;
  put(g,x,y,cell(EMPTY));
  for(let d=0;d<4;d++){
    const nx=x+DX[d],ny=y+DY[d],t=at(g,nx,ny).t;
    if(t===FUSE) light(g,nx,ny);
    else if(t===ORANGE||t===YELLOW||t===RED||t===BOMB||t===HYDRO) queue(g,nx,ny,false,1);
    else if(t===ELEC||t===PLUT) queue(g,nx,ny,true,1);
  }
}
// Every gate on the level flips: closed ones open, open ones close.
function toggleGates(g){
  if(g.tick-g.switchTick<4) return;
  g.switchTick=g.tick;g.gateFlips++;
  for(const c of g.cells) if(c.t===GATE) c.d^=1;
  emit(g,'switch');
}
// A belt carries whatever rests on it (the cell above) one step along, every CONV_EVERY ticks.
function convey(g,x,y,c){
  if(g.stasis>0||g.tick%CONV_EVERY) return;
  const a=at(g,x,y-1),tx=x+DX[c.d],ty=y-1;
  if(a.s===g.tick||a.f||at(g,tx,ty).t!==EMPTY) return;
  if(a.t===MURPHY){if(g.state==='play'&&a.mt!==g.tick){walk(g,tx,ty);g.slide=-1;}return;}
  if(falls(a.t)||a.t===YELLOW||a.t===RED||a.t===CRATE||a.t===MIRROR||a.t===HYDRO) shift(g,x,y-1,tx,ty);
}
// A magnet pulls the nearest Lead, Fuel rod or Plutonium in each direction one cell closer through
// open space, up to MAG_RANGE away, every MAG_EVERY ticks. Pulled upward or sideways, a ball stays put
// until released; it falls again as soon as nothing holds it.
function magnet(g,x,y){
  if(g.stasis>0||g.tick%MAG_EVERY) return;
  for(let d=0;d<4;d++){
    for(let k=1;k<=MAG_RANGE;k++){
      const bx=x+DX[d]*k,by=y+DY[d]*k,c=at(g,bx,by);
      if(c.t===EMPTY) continue;
      if(c.t!==ZONK&&c.t!==ROD&&c.t!==PLUT) break;
      // A ball under the magnet, or touching it, is held in the field (fall() reads c.mag); one
      // dragged sideways is not lifted, so it drops where the floor ends.
      if(d===2||k===1) c.mag=g.tick;
      if(k>1&&c.s!==g.tick&&!(c.t===ZONK&&g.freezeZ)){const p=shift(g,bx,by,bx-DX[d],by-DY[d]);p.f=false;if(d===2) p.mag=g.tick;emit(g,'magnet');}
      break;
    }
  }
}
// An Alpha particle flies straight; at anything solid it turns round and flies back the next tick.
// Iso in its way is killed.
function bounce(g,x,y,c){
  if(g.freezeE||g.stasis>0) return;
  const nx=x+DX[c.d],ny=y+DY[c.d],t=at(g,nx,ny).t;
  if(t===MURPHY) explode(g,nx,ny,false);
  else if(t===EMPTY) shift(g,x,y,nx,ny);
  else c.d=(c.d+2)%4;
}
// A Hydrogen cell rises through open space and bursts when it stops.
function rise(g,x,y,c){
  if(g.stasis>0) return;
  const above=at(g,x,y-1);
  if(above.t===EMPTY){shift(g,x,y,x,y-1);c.f=true;return;}
  if(c.f){c.f=false;explode(g,x,y,false);}
}
// Coolant creeps into one open neighbour every COOL_EVERY ticks. When no cell of it can grow any
// more it crystallises into Graphite (checked every COOL_CHECK ticks).
function grow(g,x,y,c){
  if(g.stasis>0||(g.tick+c.phase)%COOL_EVERY) return;
  for(let j=0;j<4;j++){
    const d=(j+x+y+g.tick)%4,nx=x+DX[d],ny=y+DY[d];
    if(at(g,nx,ny).t!==EMPTY) continue;
    const n=cell(COOL);n.phase=(nx*5+ny*3)%COOL_EVERY;n.s=g.tick;put(g,nx,ny,n);return;
  }
}
function crystallise(g){
  let any=false;
  for(let i=0;i<g.cells.length;i++){
    if(g.cells[i].t!==COOL) continue;
    any=true;const x=i%g.W,y=(i/g.W)|0;
    for(let d=0;d<4;d++){const t=at(g,x+DX[d],y+DY[d]).t;if(t===EMPTY||t===BASE) return;}
  }
  if(!any) return;
  for(const c of g.cells) if(c.t===COOL) c.t=BASE;
  emit(g,'crystal');
}

// Steps Iso into a teleport pad: it comes out beside the next pad on the level (reading order, wrapping),
// in its direction of travel if that side is free, otherwise on the first free side.
function teleport(g,x,y,d){
  const n=g.teles.length;let i=-1;
  for(let k=0;k<n;k++) if(g.teles[k].x===x&&g.teles[k].y===y) i=k;
  if(i<0||n<2) return;
  for(let k=1;k<n;k++){
    const p=g.teles[(i+k)%n];
    for(let j=0;j<4;j++){
      const dd=(d+j)%4,tx=p.x+DX[dd],ty=p.y+DY[dd],tc=at(g,tx,ty);
      if(tc.t!==EMPTY&&tc.t!==BASE) continue;
      walk(g,tx,ty);const c=at(g,tx,ty);c.ox=0;c.oy=0;g.m.teleTick=g.tick;
      if(tc.t===BASE) emit(g,'eat');emit(g,'tele');return;
    }
  }
}

// With gravity on, Murphy drops into empty space below him. Eating (Base, Infotrons, Red disks)
// holds him in place, which is the only way to climb or to cross a gap.
function moveMurphy(g,inp){
  const m=g.m;
  if(m.bomb>0&&--m.bomb===0){explode(g,m.x,m.y,false);return;}
  // Air: counted down only on levels that set it; at zero the suit is empty.
  if(g.usesAir&&--g.air<=0){g.air=0;kill(g);emit(g,'suffocate');return;}
  // Dose: climbs on Fallout (unless iodine covers it), heals slowly off it, kills at DOSE_MAX.
  if(g.iodine>0) g.iodine--;
  if(g.under===FALLOUT&&g.iodine===0){
    if(g.tick%4===0) emit(g,'geiger');
    if(++g.dose>=DOSE_MAX){g.dose=DOSE_MAX;kill(g);emit(g,'dosed');return;}
  }else if(g.dose>0&&g.tick%DOSE_HEAL===0) g.dose--;
  const d=inp.dir;
  const loose=g.grav&&at(g,m.x,m.y+1).t===EMPTY;
  // Sliding on Ice: Iso keeps going until he leaves the ice or something stops him; no input counts.
  if(g.slide>=0){
    const sd=g.slide,sx=m.x+DX[sd],sy=m.y+DY[sd],sc=at(g,sx,sy);
    // The slide goes on while Iso is on ice or the next cell is ice (a Pellet lying on the ice is
    // taken in passing); it ends on the first cell of plain floor.
    if(loose||(g.under!==ICE&&sc.t!==ICE)) g.slide=-1;
    else{
      if(sc.t===EMPTY||sc.t===ICE||sc.t===FALLOUT){walk(g,sx,sy);return;}
      if(sc.t===INFO){g.got++;walk(g,sx,sy);emit(g,'collect');return;}
      if(sc.t===ISO){g.got+=ISO_WORTH;walk(g,sx,sy);emit(g,'collect');return;}
      if(sc.t===ANTI){g.got=Math.max(0,g.got-1);walk(g,sx,sy);emit(g,'anti');return;}
      if(isPickup(sc.t)){pickup(g,sc);walk(g,sx,sy);return;}
      if(isEnemy(sc.t)||sc.t===ELEC){explode(g,m.x,m.y,false);return;}
      if(sc.t===ACID){dissolve(g);return;}
      if(sc.t===EXIT&&g.got>=g.need){walk(g,sx,sy);g.state='won';g.endTick=g.tick;emit(g,'win');return;}
      g.slide=-1;emit(g,'thud');
    }
  }
  // Shift held: the gadget fires once per press and Iso makes no ordinary move meanwhile.
  if(inp.gad){
    g.pushTicks=0;g.holdTicks=0;
    if(!g.gadLatch&&useGadget(g,d)) g.gadLatch=true;
    else if(loose) walk(g,m.x,m.y+1);
    return;
  }
  g.gadLatch=false;
  if(d<0){
    g.pushTicks=0;
    if(loose){g.holdTicks=0;walk(g,m.x,m.y+1);return;}
    if(inp.act){
      if(++g.holdTicks>=2&&g.red>0&&m.bomb===0){g.red--;m.bomb=BOMB_FUSE;emit(g,'arm');}
    }else g.holdTicks=0;
    return;
  }
  g.holdTicks=0;
  if(d===1||d===3) m.face=d;
  const nx=m.x+DX[d],ny=m.y+DY[d],c=at(g,nx,ny);
  if(inp.act){g.pushTicks=0;m.snapTick=g.tick;m.snapDir=d;snap(g,nx,ny,c);return;}
  if(loose&&d!==2&&!eatable(c)){g.pushTicks=0;walk(g,m.x,m.y+1);return;}
  if(g.grav&&d===0&&c.t===EMPTY) return;
  if(c.t!==ZONK&&c.t!==ORANGE&&c.t!==YELLOW&&c.t!==CRATE&&c.t!==MIRROR&&c.t!==HYDRO&&c.t!==PLUT) g.pushTicks=0;
  switch(c.t){
    case EMPTY:walk(g,nx,ny);break;
    case BASE:walk(g,nx,ny);emit(g,'eat');break;
    case BUG:walk(g,nx,ny);if(bugLive(g,c)) explode(g,nx,ny,false);else emit(g,'eat');break;
    case INFO:g.got++;walk(g,nx,ny);emit(g,'collect');break;
    case RED:g.red++;walk(g,nx,ny);emit(g,'collect');break;
    case JET:case TRACT:case STASIS:case KEY:case SHIELD:case ROD:case IODINE:case NGUN:case QTUN:case TANK:case LAMP:pickup(g,c);walk(g,nx,ny);break;
    case DOOR:if(g.keys>0){g.keys--;walk(g,nx,ny);emit(g,'door');}else emit(g,'doorlocked');break;
    case TELE:teleport(g,nx,ny,d);break;
    case ICE:walk(g,nx,ny);g.slide=d;emit(g,'slide');break;
    case FALLOUT:walk(g,nx,ny);break;
    case FUSE:walk(g,nx,ny);emit(g,'eat');break;
    case ISO:g.got+=ISO_WORTH;walk(g,nx,ny);emit(g,'collect');break;
    case ANTI:g.got=Math.max(0,g.got-1);walk(g,nx,ny);emit(g,'anti');break;
    case SWITCH:toggleGates(g);break;
    case GATE:
      if(c.d){
        const gx=nx+DX[d],gy=ny+DY[d],gc=at(g,gx,gy);
        if(gc.t===EMPTY||gc.t===BASE||isFloor(gc.t)){walk(g,gx,gy);if(gc.t===BASE) emit(g,'eat');emit(g,'gate');}
        else if(gc.t===EXIT){if(g.got>=g.need){walk(g,gx,gy);g.state='won';g.endTick=g.tick;emit(g,'gate');emit(g,'win');}else emit(g,'locked');}
      }else emit(g,'gatelocked');
      break;
    case CRATE:case MIRROR:push(g,nx,ny,c,d,1);break;
    case HYDRO:if(d===1||d===3) push(g,nx,ny,c,d,1);break;
    case PLUT:if(d===1||d===3) push(g,nx,ny,c,d,2);break;
    case ACID:dissolve(g);break;
    case EXIT:
      if(g.got>=g.need){walk(g,nx,ny);g.state='won';g.endTick=g.tick;emit(g,'win');}
      else emit(g,'locked');
      break;
    case TERM:terminal(g);break;
    case ZONK:case ORANGE:if(d===1||d===3) push(g,nx,ny,c,d,c.t===ZONK?2:1);break;
    case YELLOW:push(g,nx,ny,c,d,1);break;
    case PORT:
      if(c.d&(1<<d)){
        const tx=nx+DX[d],ty=ny+DY[d],tc=at(g,tx,ty);
        if(tc.t===EMPTY||tc.t===BASE){
          walk(g,tx,ty);emit(g,'port');
          if(c.sp){
            if(g.grav!==c.sp.grav) emit(g,c.sp.grav?'gravon':'gravoff');
            g.grav=c.sp.grav;g.freezeZ=c.sp.freezeZ;g.freezeE=c.sp.freezeE;
          }
        }
      }
      break;
    case SNIK:case ELEC:case DRONE:case ALPHA:explode(g,m.x,m.y,false);break;
  }
}
// Iso steps into Acid: nothing is left of him.
function dissolve(g){
  const m=g.m;
  kill(g);put(g,m.x,m.y,cell(g.under));g.under=EMPTY;emit(g,'acid');
}

function fall(g,x,y,c){
  if(g.stasis>0||(c.t===ZONK&&g.freezeZ)) return;
  // Plutonium at rest beside more Plutonium at rest goes critical: a fission blast, and the neighbour
  // follows it.
  if(c.t===PLUT&&!c.f) for(let d=0;d<4;d++){const n=at(g,x+DX[d],y+DY[d]);if(n.t===PLUT&&!n.f){explode(g,x,y,true);return;}}
  if(c.mag!==undefined&&g.tick-c.mag<=MAG_EVERY) return; // held in a magnet's field
  const below=at(g,x,y+1);
  if(below.t===EMPTY){shift(g,x,y,x,y+1);c.f=true;return;}
  if(c.f){
    c.f=false;
    if(below.t===MURPHY||isEnemy(below.t)){explode(g,x,y+1,false);return;}
    if(below.t===ELEC||below.t===PLUT){explode(g,x,y+1,true);return;}
    if(c.t===ORANGE){explode(g,x,y,false);return;}
    if(below.t===ORANGE||below.t===HYDRO){explode(g,x,y+1,false);return;}
    if(below.t===ACID||below.t===COOL){put(g,x,y,cell(EMPTY));emit(g,'fizz');return;}
    if(below.t===SWITCH) toggleGates(g);
    emit(g,'thud');
  }
  if(c.t===ORANGE||!isRound(below)) return;
  if(at(g,x-1,y).t===EMPTY&&at(g,x-1,y+1).t===EMPTY){shift(g,x,y,x-1,y);c.f=true;return;}
  if(at(g,x+1,y).t===EMPTY&&at(g,x+1,y+1).t===EMPTY){shift(g,x,y,x+1,y);c.f=true;}
}

// Snik Snaks and Electrons move the same way: they hug the wall on their left.
function crawl(g,x,y,c){
  if(g.freezeE||g.stasis>0) return;
  const pref=(c.d+3)%4;
  const go=function(dir){
    const nx=x+DX[dir],ny=y+DY[dir],t=at(g,nx,ny).t;
    if(t===MURPHY){c.d=dir;explode(g,nx,ny,false);return true;}
    if(t===EMPTY){c.d=dir;shift(g,x,y,nx,ny);return true;}
    return false;
  };
  if(go(pref)||go(c.d)) return;
  c.d=(c.d+1)%4;
}

/* ---------- music ---------- */
// A score made up as it plays: a low drone under a slow arpeggio through an echo, in a key and mode
// that belong to the part of the plant Iso is in. It thickens as the Pellet count nears the need, a
// dry pulse creeps in while a Gamma is close, the Reactor coming online brightens it and brings in a
// hum and a kick, and it ducks under a death, the finale and the dialogs. Silent with the sound off
// or the Music button off (that choice is kept in this browser only).
const Music=(function(){
  const PENT_MIN=[0,3,5,7,10,12,15,17,19,22],PENT_MAJ=[0,2,4,7,9,12,14,16,19,21],
        DORIAN=[0,2,3,5,7,9,10,12,14,15,17,19],PHRYGIAN=[0,1,3,5,7,8,10,12,13,15,17,19],LYDIAN=[0,2,4,6,7,9,11,12,14,16,18,19];
  // One key per category, in CATS order, then the Mirror Plant and the classic set.
  const KEYS=[[110,PENT_MIN],[123.47,DORIAN],[130.81,PENT_MIN],[146.83,PHRYGIAN],[164.81,PENT_MAJ],[174.61,LYDIAN],[196,DORIAN],[110,PENT_MIN],[98,PHRYGIAN],[87.31,PENT_MIN],[103.83,PENT_MAJ],[82.41,PHRYGIAN],[146.83,PENT_MIN]];
  let root=110,scale=PENT_MIN,drones=[],hum=[],humG=null;
  let out=null,filt=null,echo=null,seq=null,next=0,step=0,on=false,lift=0,heat=0,danger=0,duckUntil=0,level=-1,enabled=true;
  try{enabled=localStorage.getItem('fission_music')!=='off';}catch(e){}
  function build(){
    out=ac.createGain();out.gain.value=0;out.connect(musBus);
    echo=ac.createDelay(1);echo.delayTime.value=0.375;
    const fb=ac.createGain(),wet=ac.createGain();fb.gain.value=0.38;wet.gain.value=0.5;
    echo.connect(fb).connect(echo);echo.connect(wet).connect(out);
    filt=ac.createBiquadFilter();filt.type='lowpass';filt.frequency.value=260;filt.Q.value=4;
    const dg=ac.createGain();dg.gain.value=0.2;filt.connect(dg).connect(out);
    drones=[.5,.502,.75].map(function(m){const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=root*m;o.connect(filt);o.start();return [o,m];});
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=0.07;lg.gain.value=120;lfo.connect(lg).connect(filt.frequency);lfo.start();
    // The Reactor's hum once it is online: two sines an octave apart, faded in with the lift.
    humG=ac.createGain();humG.gain.value=0;humG.connect(out);
    hum=[.5,1].map(function(m){const o=ac.createOscillator();o.type='sine';o.frequency.value=root*m;o.connect(humG);o.start();return [o,m];});
    seq=rng(Date.now()&0xffff);next=ac.currentTime+0.1;
  }
  function retune(){
    if(!out) return;
    const t=ac.currentTime;
    drones.concat(hum).forEach(function(d){d[0].frequency.setTargetAtTime(root*d[1],t,0.8);});
  }
  function note(f,t,dur,vol,type){
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(out);g.connect(echo);o.start(t);o.stop(t+dur+0.05);
  }
  function kick(t){
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+0.18);
    g.gain.setValueAtTime(0.45,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
    o.connect(g).connect(out);o.start(t);o.stop(t+0.3);
  }
  // A dry tick of noise: the pulse that creeps in while something is hunting Iso.
  function hat(t,vol){
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=noiseBuffer();f.type='highpass';f.frequency.value=6000;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
    s.connect(f).connect(g).connect(out);s.start(t);s.stop(t+0.05);
  }
  return {
    enabled:function(){return enabled;},
    toggle:function(){enabled=!enabled;try{localStorage.setItem('fission_music',enabled?'on':'off');}catch(e){}},
    // The key for a part of the plant: an index into KEYS (a category, 11 the Mirror Plant, 12 classic).
    setKey:function(k){const key=KEYS[((k%KEYS.length)+KEYS.length)%KEYS.length];root=key[0];scale=key[1];retune();},
    // Quiet for a moment: a death, the finale.
    duck:function(sec){if(ac) duckUntil=ac.currentTime+sec;},
    // Every frame. mood: 0 menu, 1 playing, 2 Reactor online, 3 a dialog over the board. st, while
    // playing: heat is how close the Pellet count is to the need (0..1), danger a hunter near Iso (0..1).
    tick:function(mood,st){
      if(!ac) return;
      const want=save.sound&&enabled&&document.visibilityState!=='hidden';
      if(want&&!out) build();
      if(!out) return;
      const t=ac.currentTime;
      on=want;
      const lv=!on?0:t<duckUntil?0.012:mood===3?0.03:0.06;
      if(lv!==level){level=lv;out.gain.cancelScheduledValues(t);out.gain.setTargetAtTime(lv,t,on?0.4:0.6);}
      lift+=((mood===2?1:0)-lift)*0.02;
      heat+=((st?st.heat:0)-heat)*0.02;
      danger+=((st&&mood!==2?st.danger:0)-danger)*0.05;
      filt.frequency.setTargetAtTime(260+500*lift+150*heat,t,0.5);
      humG.gain.setTargetAtTime(0.05*lift,t,0.5);
      if(!on){next=t+0.1;return;}
      const beat=mood===2?0.2:0.25-0.03*heat;
      if(next<t) next=t+0.05; // after a stall, pick up from now rather than play the backlog at once
      while(next<t+0.25){
        const s=step++%16,quiet=mood===0||mood===3,every=quiet?4:mood===1&&heat<.66?2:1;
        if(s%every===0&&seq()<(quiet?.6:.85)){
          const span=mood===2?scale.length:Math.min(scale.length,6+Math.floor(heat*4));
          const i=Math.floor(seq()*span);
          note(root*2*Math.pow(2,scale[i]/12),next,beat*(mood===2?1.6:3),(mood===2?0.035:0.04)*(1-0.4*danger),mood===2?'square':'triangle');
        }
        if(mood===2&&s%4===0) kick(next);
        if(danger>.05&&s%2===0) hat(next,0.035*danger);
        next+=beat;
      }
    }
  };
})();

/* ---------- drawing (unit square: 0..1) ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);}
function hex(c,x,y,r){c.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();}
function rnd(s){const v=Math.sin(s)*43758.5453;return v-Math.floor(v);}
// The radiation trefoil: three 60-degree blades (one pointing down) round a hub.
function trefoil(c,x,y,r,col){
  c.fillStyle=col;
  for(let k=0;k<3;k++){
    const a=Math.PI/2+k*Math.PI*2/3;
    c.beginPath();c.arc(x,y,r,a-Math.PI/6,a+Math.PI/6);c.arc(x,y,r*.3,a+Math.PI/6,a-Math.PI/6,true);c.closePath();c.fill();
  }
  circ(c,x,y,r*.18);c.fill();
}

  // Neutron gun: a stubby launcher with a blue muzzle glow.
  ngun:function(c){

/* ---------- sprite cache ---------- */
let TS=40,DPR=1,VW=1,VH=1;
const sprites=new Map();
function spr(key,fn){
  let s=sprites.get(key);
  if(!s){
    const px=Math.max(1,Math.round(TS*DPR));
    s=document.createElement('canvas');s.width=s.height=px;
    const c=s.getContext('2d');c.scale(px,px);fn(c,px);sprites.set(key,s);
  }
  return s;
}
function tileSprite(c,x,y,now){
  switch(c.t){
    // An idle Hot spot is drawn exactly like Graphite: nothing gives it away until it flares.
    case BASE:case BUG:{const v=(x*3+y*5)&3;return spr('graphite'+v,function(k){D.graphite(k,v);});}
    case HARD:{const v=c.v;return v?spr('concrete'+v,function(k){D.concreteDeco(k,v);}):spr('concrete',D.concrete);}
    case RAM:{const v=c.v;return v?spr('cask'+v,function(k){D.caskHalf(k,v);}):spr('cask',D.cask);}
    case ZONK:{const f=reduceMotion?0:(Math.floor(now/90)+x*5+y*3)%12;return spr('lead'+f,function(k){D.lead(k,f);});}
    case INFO:{const f=reduceMotion?0:(Math.floor(now/110)+x*3+y*5)%8;return spr('pellet'+f,function(k){D.pellet(k,f);});}
    case ORANGE:return spr('orange',function(k){D.canister(k,CANISTER.orange);});
    case YELLOW:return spr('yellow',function(k){D.canister(k,CANISTER.yellow);});
    case RED:return spr('red',function(k){D.canister(k,CANISTER.red);});
    case PORT:{const m=c.d;return spr('airlock'+m,function(k){D.airlock(k,m);});}
    case TERM:{const f=reduceMotion?0:Math.floor(now/350)%4;return spr('initiator'+f,function(k){D.initiator(k,f);});}
    case EXIT:{const o=game.got>=game.need;return spr('reactor'+(o?1:0),function(k){D.reactor(k,o);});}
    case JET:return spr('thruster',D.thruster);
    case TRACT:return spr('tractor',D.tractor);
    case STASIS:return spr('stasis',D.stasis);
    case TELE:{const f=reduceMotion?0:Math.floor(now/120)%8;return spr('telepad'+f,function(k){D.telepad(k,f);});}
    case DOOR:return spr('door',D.door);
    case KEY:return spr('keycard',D.keycard);
    case LASER:{
      // Five looks per axis: four steps of charge, then live.
      const pos=(game.tick+c.phase)%LASER_CYCLE,q=pos<LASER_ON?4:Math.floor((pos-LASER_ON)/(LASER_CYCLE-LASER_ON)*4),v=c.d;
      return spr('laser'+v+q,function(k){D.laser(k,v,q/4);});
    }
    case ROD:{const f=reduceMotion?0:(Math.floor(now/110)+x*3+y*5)%8;return spr('rod'+f,function(k){D.rod(k,f);});}
    case SHIELD:return spr('shield',D.shieldPickup);
    case ICE:{const v=(x*5+y*3)&3;return spr('ice'+v,function(k){D.ice(k,v);});}
    case CONV:{const f=reduceMotion?0:Math.floor(now/90)%4,d=c.d;return spr('belt'+d+f,function(k){D.belt(k,d,f);});}
    case MAGNET:{const f=reduceMotion?0:Math.floor(now/140)%6;return spr('magnet'+f,function(k){D.magnet(k,f);});}
    case MIRROR:{const d=c.d;return spr('mirror'+d,function(k){D.mirror(k,d);});}
    case SWITCH:return spr('switch',D.switchPlate);
    case GATE:{const o=c.d;return spr('gate'+o,function(k){D.gate(k,o);});}
    case CRATE:return spr('crate',D.crateBlock);
    case ACID:{const f=reduceMotion?0:(Math.floor(now/160)+x*2+y)%6;return spr('acid'+f,function(k){D.acid(k,f);});}
    case FUSE:{const v=(x*3+y*5)&3;return spr('fuse'+v,function(k){D.fuse(k,v);});}
    case COOL:{const f=reduceMotion?0:(Math.floor(now/140)+x+y*3)%8;return spr('coolant'+f,function(k){D.coolant(k,f);});}
    case HYDRO:return spr('hydro',D.hydro);
    case ANTI:{const f=reduceMotion?0:(Math.floor(now/110)+x*3+y*5)%8;return spr('anti'+f,function(k){D.antipellet(k,f);});}
    case FALLOUT:{const f=reduceMotion?0:(Math.floor(now/220)+x+y)%4;return spr('fallout'+f,function(k){D.fallout(k,f);});}
    case IODINE:return spr('iodine',D.iodine);
    case PLUT:{const f=reduceMotion?0:(Math.floor(now/130)+x*3+y*5)%8;return spr('plut'+f,function(k){D.plutonium(k,f);});}
    case ISO:{const f=reduceMotion?0:(Math.floor(now/110)+x*3+y*5)%8,q=Math.max(1,Math.ceil(c.timer/HALF_LIFE*6));return spr('iso'+q+'_'+f,function(k){D.isotope(k,f,q/6);});}
    case NGUN:return spr('ngun',D.ngun);
    case QTUN:return spr('qtun',D.qtun);
    case TANK:return spr('tank',D.tank);
    case LAMP:return spr('lamp',D.lamp);
  }
  return null;
}

function resize(){
  const r=stage.getBoundingClientRect();
  VW=Math.max(1,r.width);VH=Math.max(1,r.height);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  // Fifteen tiles across on a desktop; on a phone nine, so the board is zoomed in and scrolls with Iso.
  const across=VW<=600||coarse?9:15;
  TS=Math.max(22,Math.min(56,Math.floor(Math.min(VW/across,VH/9))));
  sprites.clear();cam.set=false;
}

/* ---------- spectacle ---------- */
// The Reactor's halo, beacon and ignition, drawn over the tiles; the rules never read any of it. Kept
// faint on purpose: the player asked for less glow. Moving parts hold still under reduced motion.
const glows=new Map();
// A soft round light in one colour (#rrggbb), drawn once and stamped wherever that colour shines.
function glow(col){
  let s=glows.get(col);
  if(!s){
    s=document.createElement('canvas');s.width=s.height=128;
    const c=s.getContext('2d'),g=c.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0,col);g.addColorStop(.3,col+'40');g.addColorStop(1,col+'00');
    c.fillStyle=g;c.fillRect(0,0,128,128);glows.set(col,s);
  }
  return s;
}
function exitCell(g){
  if(g.exitAt===undefined){g.exitAt=null;for(let i=0;i<g.cells.length;i++) if(g.cells[i].t===EXIT){g.exitAt={x:i%g.W,y:(i/g.W)|0};break;}}
  return g.exitAt;
}
// The one standing light: a quiet halo on the Reactor once it is online. Tiles carry their own colour, so
// nothing else on the floor is lit.
function reactorHalo(g,now,tsD){
  const e=exitCell(g);
  if(!e||g.got<g.need||g.state!=='play'||at(g,e.x,e.y).t!==EXIT) return;
  const R=tsD*1.3,X=(e.x+.5-cam.x)*tsD,Y=(e.y+.5-cam.y)*tsD;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=reduceMotion?.18:.14+.06*Math.sin(now/240);
  ctx.drawImage(glow('#4fb8ff'),X-R,Y-R,2*R,2*R);ctx.restore();
}
// Once the need is met: a slow ring on the Reactor, or, while it is off screen, a pointer on the edge
// of the playfield aimed at it.
function beacon(g,now,tsD){
  const e=exitCell(g);
  if(!e||g.got<g.need||g.state!=='play'||at(g,e.x,e.y).t!==EXIT) return;
  const X=(e.x+.5-cam.x)*tsD,Y=(e.y+.5-cam.y)*tsD,w=cv.width,h=cv.height,pu=reduceMotion?.5:.5+.5*Math.sin(now/200);
  ctx.save();ctx.globalCompositeOperation='lighter';
  if(X>-tsD&&X<w+tsD&&Y>-tsD&&Y<h+tsD){
    if(!reduceMotion){
      const k=(now/1800)%1;
      ctx.globalAlpha=(1-k)*.2;ctx.strokeStyle='#9fdcff';ctx.lineWidth=Math.max(1,tsD*.04);
      ctx.beginPath();ctx.arc(X,Y,tsD*(.5+k*1.1),0,6.283);ctx.stroke();
    }
  }else{
    // Kept clear of the edges, and further off the bottom, where the hints show.
    const cx=w/2,cy=h/2,dx=X-cx,dy=Y-cy,m=tsD*.7,mv=dy>0?Math.max(m,64*DPR):m;
    const s=Math.min((cx-m)/Math.max(1e-6,Math.abs(dx)),(cy-mv)/Math.max(1e-6,Math.abs(dy)));
    const ax=cx+dx*s,ay=cy+dy*s;
    // The pointer pops in when the Reactor comes online, with a little overshoot.
    const pk=reduceMotion?1:Math.min(1,(now-reactorT)/350),ps=pk<1?pk*(1+.6*Math.sin(pk*Math.PI)):1;
    ctx.translate(ax,ay);ctx.scale(ps,ps);ctx.globalAlpha=.75+.25*pu;
    ctx.globalCompositeOperation='source-over';
    ctx.rotate(Math.atan2(dy,dx));
    ctx.beginPath();ctx.moveTo(tsD*.55,0);ctx.lineTo(-tsD*.3,-tsD*.38);ctx.lineTo(-tsD*.12,0);ctx.lineTo(-tsD*.3,tsD*.38);ctx.closePath();
    ctx.lineWidth=Math.max(2,tsD*.08);ctx.strokeStyle='rgba(5,7,10,.9)';ctx.stroke();ctx.fillStyle='#e8f6ff';ctx.fill();
    ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=.9;
    ctx.font='700 '+Math.round(tsD*.3)+'px '+FONT_D;ctx.textAlign='center';ctx.textBaseline='middle';
    const ly=ay+(dy>0?-tsD*.75:tsD*.75);
    ctx.lineWidth=Math.max(2,tsD*.08);ctx.strokeStyle='rgba(5,7,10,.85)';ctx.strokeText('CORE',ax,ly);ctx.fillStyle='#9fdcff';ctx.fillText('CORE',ax,ly);
  }
  ctx.restore();
}
// The Reactor taking Iso in: three shock rings and a short white bloom.
let ign=null;const IGN_MS=1100;
function ignite(x,y){ign={x:x,y:y,t:performance.now()};}
function drawIgnition(now,tsD){
  if(!ign) return;
  const k=Math.max(0,(now-ign.t)/IGN_MS);
  if(k>=1){ign=null;return;}
  const X=(ign.x+.5-cam.x)*tsD,Y=(ign.y+.5-cam.y)*tsD,R=Math.hypot(cv.width,cv.height);
  ctx.save();ctx.globalCompositeOperation='lighter';
  if(!reduceMotion){
    for(let i=0;i<3;i++){
      const q=k*1.4-i*.18;
      if(q<=0||q>=1) continue;
      ctx.globalAlpha=(1-q)*.3;ctx.strokeStyle=i?'#4fb8ff':'#e8f6ff';ctx.lineWidth=tsD*.2*(1-q)+1;
      ctx.beginPath();ctx.arc(X,Y,q*R*.5,0,6.283);ctx.stroke();
    }
  }
  ctx.globalAlpha=Math.max(0,.35-k*.9);ctx.drawImage(glow('#e8f6ff'),X-tsD*1.5,Y-tsD*1.5,tsD*3,tsD*3);
  ctx.restore();
}
// Darkens the corners of the playfield, drawn once per canvas size.
let vig=null;
function vignette(){
  if(!vig||vig.width!==cv.width||vig.height!==cv.height){
    vig=document.createElement('canvas');vig.width=cv.width;vig.height=cv.height;
    const c=vig.getContext('2d'),w=cv.width,h=cv.height,g=c.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.hypot(w,h)/2);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.35)');c.fillStyle=g;c.fillRect(0,0,w,h);
  }
  ctx.drawImage(vig,0,0);
}
function reactorOnline(){
  const e=exitCell(game);
  toast('Reactor online. Get Iso to the core.',3000);
  reactorT=performance.now();
  SFX.online();flash('rgba(79,184,255,.22)');jolt(.1,250);
  if(e) burst(e.x,e.y,'#9fdcff');
}

/* ---------- render ---------- */
function render(now){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=theme.vd;ctx.fillRect(0,0,cv.width,cv.height);
  if(!game) return;
  const g=game,p=Math.min(1,acc/TICK);
  // Death and the finale pull the camera in a little; everything else sits at 1.
  const zoomTo=!reduceMotion&&(screen==='play'||screen==='over')&&g.state!=='play'?(g.state==='dead'?1.1:1.12):1;
  zoom+=(zoomTo-zoom)*Math.min(1,dt*4);if(Math.abs(zoom-zoomTo)<.001) zoom=zoomTo;
  const tsD=TS*DPR*zoom,vw=VW/TS/zoom,vh=VH/TS/zoom;
  // The intro: tiles appear in a wave spreading from Iso, each fading and growing in over 300 ms.
  const introAge=introT>0&&!reduceMotion?now-introT:-1;
  const introA=function(x,y){return introAge<0?1:clamp((introAge-Math.min(24,Math.abs(x-g.m.x)+Math.abs(y-g.m.y))*25)/300,0,1);};
  const mc=at(g,g.m.x,g.m.y);
  let mx=g.m.x,my=g.m.y;
  if(mc.t===MURPHY&&mc.mt===g.tick){const q=easeP(g,mc,p);mx+=mc.ox*(1-q);my+=mc.oy*(1-q);}
  // Behind the menu the camera drifts slowly over the level, so the entrance is never a still.
  if(screen==='menu'&&!reduceMotion){mx+=Math.sin(now/9000)*g.W*.25;my+=Math.sin(now/13000)*g.H*.15;}
  const tx=g.W<=vw?(g.W-vw)/2:clamp(mx+.5-vw/2,0,g.W-vw);
  const ty=g.H<=vh?(g.H-vh)/2:clamp(my+.5-vh/2,0,g.H-vh);
  if(!cam.set||reduceMotion){cam.x=tx;cam.y=ty;cam.set=true;}
  else{const k=Math.min(1,dt*9);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;}
  let jx=0,jy=0; // camera shake, in tiles, taken back off at the end of the frame
  if(shake>0){const left=shakeEnd-now;if(left<=0) shake=0;else{const a=shake*Math.min(1,left/350);jx=(Math.random()*2-1)*a;jy=(Math.random()*2-1)*a;}}
  cam.x+=jx;cam.y+=jy;
  const x0=Math.max(0,Math.floor(cam.x)-1),y0=Math.max(0,Math.floor(cam.y)-1);
  const x1=Math.min(g.W-1,Math.ceil(cam.x+vw)+1),y1=Math.min(g.H-1,Math.ceil(cam.y+vh)+1);
  const PX=function(x){return Math.round((x-cam.x)*tsD);},PY=function(y){return Math.round((y-cam.y)*tsD);};
  // This frame's motion: balls settling, gates mid-flip, the Reactor's iris opening.
  let landMap=null;
  if(lands.length){landMap=new Map();for(const l of lands){const k=(now-l.t)/LAND_MS;if(k>=0&&k<1) landMap.set(l.y*g.W+l.x,Math.sin(k*Math.PI));}}
  const gk=reduceMotion?1:(now-gateFlipT)/GATE_MS,irisK=reduceMotion?1:(now-reactorT)/IRIS_MS;
  // Draws a cached sprite in a cell, scaled about its centre (or its bottom edge, ay=1) and turned.
  const tile=function(s,X,Y,sx,sy,rot,ay){
    if(sx===1&&sy===1&&!rot){ctx.drawImage(s,Math.round(X),Math.round(Y),Math.round(tsD),Math.round(tsD));return;}
    ay=ay===undefined?.5:ay;
    ctx.setTransform(sx,0,0,sy,X+tsD/2,Y+tsD*ay);if(rot) ctx.rotate(rot);
    ctx.drawImage(s,-tsD/2,-tsD*ay,tsD,tsD);ctx.setTransform(1,0,0,1,0,0);
  };
  const dyn=[],live=[];
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const c=g.cells[y*g.W+x];
    if(c.t===EMPTY||c.t===INVIS) continue;
    if(c.t===MURPHY||c.t===SNIK||c.t===ELEC||c.t===DRONE||c.t===ALPHA||c.t===BURN||c.t===EXPL||c.t===BOMB||(c.mt===g.tick&&(c.ox||c.oy))){dyn.push([c,x,y]);continue;}
    const s=tileSprite(c,x,y,now);
    if(s){const X=PX(x),Y=PY(y),lk=landMap?landMap.get(y*g.W+x):undefined;
      if(introAge>=0){
        const ia=introA(x,y);
        if(ia<=0) continue;
        if(ia<1){ctx.globalAlpha=ia;const sc=.6+.4*easeOut(ia);tile(s,X,Y,sc,sc,0);ctx.globalAlpha=1;continue;}
      }
      if(c.t===EXIT&&irisK<1){
        // The core opening: the cold vessel, with the lit one showing through a widening circle.
        ctx.drawImage(spr('reactor0',function(k){D.reactor(k,false);}),X,Y,tsD,tsD);
        ctx.save();ctx.beginPath();ctx.arc(X+tsD/2,Y+tsD/2,Math.max(.01,easeOut(Math.max(0,irisK)))*.75*tsD,0,6.283);ctx.clip();
        ctx.drawImage(spr('reactor1',function(k){D.reactor(k,true);}),X,Y,tsD,tsD);ctx.restore();
        continue;
      }
      else if(c.t===GATE&&gk<1){const prev=gk<.5;tile(prev?spr('gate'+(c.d^1),function(k){D.gate(k,c.d^1);}):s,X,Y,Math.max(.04,Math.abs(Math.cos(gk*Math.PI))),1,0);}
      else if(c.t===SWITCH&&gk<.75){const e=.08*Math.sin(gk/.75*Math.PI);tile(s,X,Y,1-e,1-e,0);}
      else if(lk!==undefined) tile(s,X,Y,1+.12*lk,1-.1*lk,0,1);
      else ctx.drawImage(s,X,Y,PX(x+1)-X,PY(y+1)-Y);
      if(c.t===ZONK){const k=heatAt(x,y,now);if(k>0){ctx.setTransform(tsD,0,0,tsD,X,Y);D.leadHeat(ctx,k);ctx.setTransform(1,0,0,1,0,0);}}}
    if((c.t===BUG&&bugLive(g,c))||(c.t===EXIT&&g.got>=g.need)) dyn.push([c,x,y]);
    if(c.t===LASER&&laserLive(g,c)) live.push([c,x,y]);
  }
  // Live beams, drawn under everything that moves. An emitter just off screen can still reach in.
  for(let i=0;i<g.cells.length;i++){
    const c=g.cells[i];
    if(c.t!==LASER||!laserLive(g,c)) continue;
    const x=i%g.W,y=(i/g.W)|0;
    if(x>=x0&&x<=x1&&y>=y0&&y<=y1) continue;
    live.push([c,x,y]);
  }
  const flick=reduceMotion?.5:(Math.floor(now/50)%2);
  for(const it of live) for(const b of beamCells(g,it[1],it[2],it[0])){
    if(b.t!==EMPTY) continue;
    ctx.setTransform(tsD,0,0,tsD,PX(b.x),PY(b.y));D.beam(ctx,b.v,flick);ctx.setTransform(1,0,0,1,0,0);
  }
  // Mechanisms mid-move: an airlock's wheel turning after Iso passed, a blast door sliding open.
  if(trans.size) for(const e of trans){
    const idx=e[0],tr=e[1],k=(now-tr.t)/tr.ms;
    if(k>=1){trans.delete(idx);continue;}
    const x=idx%g.W,y=(idx/g.W)|0;
    if(x<x0||x>x1||y<y0||y>y1) continue;
    const X=PX(x),Y=PY(y);
    if(tr.k==='door'){const o=easeOut(k)*tsD;ctx.save();ctx.beginPath();ctx.rect(X,Y,tsD,tsD);ctx.clip();ctx.drawImage(spr('door',D.door),tr.ax?X:X-o,tr.ax?Y-o:Y,tsD,tsD);ctx.restore();}

// falls is ever placed over open space or over a Gamma, so the floor is still when it starts.
function genMeltdown(round,seed){
  const r=rng(seed),size=round<3?[24,11]:round<6?[32,14]:round<10?[44,18]:[60,24],W=size[0],H=size[1];
  const g=[];for(let y=0;y<H;y++){g.push([]);for(let x=0;x<W;x++) g[y].push(x===0||y===0||x===W-1||y===H-1?'#':'.');}
  const area=(W-2)*(H-2),n=function(f){return Math.round(area*f);},k=Math.min(round,12);
  // Upgrades join from round 2: Fuel rods and a Thruster, then a Shield, Drones (in pockets, like the
  // Gammas) with Stasis to answer them, a pair of teleport pads, and lasers buried in the Graphite.
  const want={'*':n(.10+.008*k),'O':n(.06+.012*k),'B':round>=3?n(.015+.005*k):0,'S':round>=5?Math.min(8,1+Math.floor((round-5)/2)):0,'o':round>=7?Math.min(14,2+(round-7)):0,
    'U':round>=2?n(.006+.001*k):0,'J':round>=2?1:0,'H':round>=3?1:0,'G':round>=4?Math.min(6,1+Math.floor((round-4)/2)):0,'Z':round>=4?1:0,'W':round>=5?2:0,
    'l':round>=6?Math.min(5,1+Math.floor((round-6)/2)):0,'i':round>=8?Math.min(4,1+Math.floor((round-8)/2)):0,
    // The Element Wings: isotopes and crates early, then acid, antimatter and a Neutron gun, Alphas
    // in lanes, Plutonium, hydrogen and a tunnel, fallout with iodine, magnets, and coolant last.
    'h':round>=2?n(.005+.001*k):0,'c':round>=3?n(.004):0,'a':round>=5?n(.008+.002*k):0,'!':round>=5?n(.006):0,'N':round>=5?1:0,
    'A':round>=6?Math.min(6,1+Math.floor((round-6)/2)):0,'P':round>=7?Math.min(10,2+(round-7)):0,'F':round>=7?n(.004):0,'Q':round>=7?1:0,
    'r':round>=8?n(.03):0,'p':round>=8?2:0,'M':round>=9?Math.min(4,1+Math.floor((round-9)/2)):0,'~':round>=10?Math.min(3,round-9):0};
  const ok=function(x,y){return g[y][x]==='.'&&(x>3||y>3)&&!(x>=W-3&&y>=H-3);};
  const place=function(ch,count){
    let placed=0;
    for(let t=0;t<count*60&&placed<count;t++){
      const x=1+Math.floor(r()*(W-2)),y=1+Math.floor(r()*(H-2));
      if(!ok(x,y)) continue;
      if(ch==='S'||ch==='G'||ch==='A'){
        if(x+4>=W-1) continue;
        let free=true;for(let i=0;i<4;i++) if(!ok(x+i,y)||g[y-1][x+i]!=='.'||g[y+1][x+i]!=='.') free=false;
        if(!free) continue;
        for(let i=1;i<4;i++) g[y][x+i]=' ';
        g[y][x]=ch;placed++;continue;
      }
      if('O*oUhP!'.indexOf(ch)>=0&&(g[y+1][x]===' '||g[y+1][x]==='S'||g[y+1][x]==='G'||g[y+1][x]==='A')) continue; // a pocket's first cell empties on its first step
      if(ch==='F'&&g[y-1][x]!=='.') continue;
      if(ch==='P'&&(g[y-1][x]==='P'||g[y+1][x]==='P'||g[y][x-1]==='P'||g[y][x+1]==='P')) continue;
      g[y][x]=ch;placed++;
    }
    return placed;
  };
  place('S',want.S);place('G',want.G);place('A',want.A);place('O',want.O);place('o',want.o);place('B',want.B);
  place('J',want.J);place('H',want.H);place('Z',want.Z);place('W',want.W);place('l',want.l);place('i',want.i);
  place('c',want.c);place('a',want.a);place('!',want['!']);place('N',want.N);place('P',want.P);place('F',want.F);place('Q',want.Q);
  place('r',want.r);place('p',want.p);place('M',want.M);place('~',want['~']);
  const pellets=place('*',want['*'])+ROD_WORTH*place('U',want.U)+ISO_WORTH*place('h',want.h);
  g[1][1]='@';g[H-2][W-2]='X';
  return {name:'Round '+round,need:Math.max(1,Math.ceil(pellets*.6)),hint:'',map:g.map(function(row){return row.join('');})};
}
function startMeltdown(){
  mode='meltdown';melt={round:0,left:MELT_START,seed:(Math.random()*1e9)>>>0,score:0};
  nextRound();
  toast('Meltdown. '+(MELT_START/8)+' seconds on the clock: every Pellet adds '+(MELT_PELLET/8)+', every floor you finish adds '+(MELT_CLEAR/8)+'.',6000);
}
function nextRound(){
  melt.round++;
  setTheme(themeFor('meltdown',melt.round-1));game=createGame(genMeltdown(melt.round,melt.seed+melt.round*7919));game.levelSet='meltdown';noteFeatures(game);
  acc=0;cam.set=false;lastLocked=-99;blasts.length=0;snaps.length=0;shots.length=0;pops.length=0;eatT=-1e9;shieldLostT=-1e9;heat=null;combo=0;comboTick=-99;maxCombo=0;
  score=melt.score;game.label='Meltdown · Round '+melt.round;
  screen='play';ov.hidden=true;ov.innerHTML='';clearInput();hud();cv.classList.remove('dead','paused');
  wearTheme('Meltdown',melt.round-1);
  introHint=melt.round>1?'Round '+melt.round+' · +'+(MELT_CLEAR/8)+' s':'60 s on the clock. Every Pellet adds time; every floor adds more.';
  showIntro('Round '+melt.round,'Meltdown',theme.fl[3]);
  try{cv.focus({preventScroll:true});}catch(e){}
}
// The clock for one tick of play: counts down, pays for pellets, and blows the core at zero.
function meltTick(g,got0){
  if(g.got>got0){melt.left+=MELT_PELLET*(g.got-got0);pops.push({x:g.m.x,y:g.m.y-.7,text:'+'+(MELT_PELLET/8)+' s',col:'#9fdcff',t:performance.now()});}
  if(g.state!=='play') return;
  if(--melt.left<=0){melt.left=0;explode(g,g.m.x,g.m.y,false);toast('The core went critical.',4000);}
}
function meltRoundClear(){
  melt.left+=MELT_CLEAR;melt.score=score+500*melt.round;
  nextRound();
}
function showMeltdownOver(){
  screen='over';
  const total=score,best=save.meltScore,newBest=total>best;
  if(newBest) save.meltScore=total;
  if(melt.round>save.meltRound) save.meltRound=melt.round;
  persist();
  const tally='<span class="tally"><span>Floors reached</span><b>'+melt.round+'</b>'+
    '<span class="sum">Score</span><b class="sum" data-n="'+total+'">0</b>'+
    '<span class="'+(newBest?'new':'')+'">'+(newBest?'New best':'Best '+fmtN(best)+' · round '+save.meltRound)+'</span><b></b></span>';
  dialog('Meltdown',tally,[['meltdown','Run again (R)'],['levels','Levels']],'rise');
  countUp();
}
function meltdownCard(){

// Mushroom clouds outlive the explosion cells under them, so they are tracked here, not in the game.
const blasts=[],BLAST_MS=1100;
let eatT=-1e9; // when Iso last ate a Pellet, for its radiation flash
let shieldLostT=-1e9;const HALO_MS=450; // when the Shield broke, for the bursting halo
// The Lead ball Iso is pushing, and when it was last pushed; it glows red-hot, fading over HEAT_MS.
let heat=null;const HEAT_MS=500;
function heatAt(x,y,now){return heat&&heat.x===x&&heat.y===y?clamp(1-(now-heat.t)/HEAT_MS,0,1):0;}
function noteHeat(g){
  const d=g.pushDir;
  if(d<0||g.state!=='play'||!(g.pushTicks>0||g.events.indexOf('push')>=0)) return;
  const x=g.m.x+DX[d],y=g.m.y+DY[d];
  if(at(g,x,y).t===ZONK) heat={x:x,y:y,t:performance.now()};
}
function noteBlasts(g){
  if(g.events.indexOf('boom')<0) return;
  const t=performance.now();
  for(let i=0;i<g.cells.length;i++){const c=g.cells[i];if(c.t===EXPL&&c.c&&c.s===g.tick) blasts.push({x:i%g.W,y:(i/g.W)|0,t:t});}
}

const hudCache={};
function setText(el,key,v){if(hudCache[key]!==v){hudCache[key]=v;el.textContent=v;}}
function hud(){
  if(!game) return;
  const left=Math.max(0,game.need-game.got);
  setText(sNeed,'need',left===0?'REACTOR READY':pad3(left));
  sNeed.classList.toggle('open',left===0);
  setText(sRed,'red',String(game.red));
  redStat.hidden=!(game.hasRed||game.red>0); // most levels have no red canisters; keep the bar short
  const gd=game.gadget;
  setText(sGad,'gad',gd?GADGET_NAME[gd.k]+' ×'+gd.n:'—');
  gadStat.hidden=!(game.hasGad||gd);
  // The gadget stat's icon is whichever gadget Iso holds.
  const gk=gd?gd.k:0;
  if(hudCache.gadK!==gk){hudCache.gadK=gk;const ico=$('gadIco');ico.dataset.legend={19:'thruster',20:'tractor',21:'stasis',47:'ngun',48:'qtun'}[gk]||'thruster';drawLegend(gadStat);}
  bGad.disabled=!gd;
  setText(sKeys,'keys',String(game.keys));
  keyStat.hidden=!(game.hasKeys||game.keys>0);
  setText(sShield,'shield',game.shield?'On':'Off');
  sShield.classList.toggle('on',game.shield);
  shieldStat.hidden=!(game.hasShield||game.shield);
  const dosePct=Math.round(game.dose/DOSE_MAX*100);
  setText(sDose,'dose',game.iodine>0?'Iodine '+Math.ceil(game.iodine/8)+'s':dosePct+'%');
  sDose.classList.toggle('low',game.iodine===0&&dosePct>=50);
  doseStat.hidden=!(game.hasDose||game.dose>0);
  setText(sAir,'air',fmt(game.air*TICK/1000));
  sAir.classList.toggle('low',game.usesAir&&game.air<80);
  airStat.hidden=!game.usesAir;
  const cb=combo>1?'×'+combo:'';
  if(hudCache.combo!==cb){hudCache.combo=cb;sCombo.hidden=!cb;if(cb){sCombo.textContent=cb;sCombo.style.animation='none';void sCombo.offsetWidth;sCombo.style.animation='';}}
  if(mode==='meltdown'){setText(sTime,'time',fmt(melt.left*TICK/1000));sTime.classList.toggle('low',melt.left<80);}
  else{setText(sTime,'time',fmt((game.state==='play'?game.tick:game.endTick)*TICK/1000));sTime.classList.remove('low');}
  setText(lvlName,'lvl',levelLabel(cur));
  lvlName.dataset.short=mode==='meltdown'?'R'+melt.round:pad3(cur+1); // what a phone's one-line header shows
  gravStat.hidden=!game.usesGrav;
  setText(sGrav,'grav',game.grav?'On':'Off');
}
