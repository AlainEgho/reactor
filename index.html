// The Fission level (0-based) each tile type first appears in, and how often each type turns up in each
// category, found by scanning the levels once.
let firstSeen=null,catCounts=null;
function partFirstSeen(){
  if(firstSeen) return firstSeen;
  firstSeen={};catCounts=CATS.map(function(){return {};});
  LEVELS.forEach(function(lv,i){
    let g;try{g=createGame(lv);}catch(e){return;}
    const n=catCounts[catOf(i)];
    for(const c of g.cells){if(firstSeen[c.t]===undefined) firstSeen[c.t]=i;n[c.t]=(n[c.t]||0)+1;}
  });
  return firstSeen;
}
// The components a category uses most, leaving out the floor, the walls and Iso.
function partsFeatured(k){
  partFirstSeen();
  const n=catCounts[k];
  return PARTS.filter(function(p){return n[p[2]]&&p[2]!==BASE&&p[2]!==HARD&&p[2]!==MURPHY;}).sort(function(a,b){return n[b[2]]-n[a[2]];});
}
// The components each category brings in, in PARTS order.
function partsByCat(){
  const seen=partFirstSeen(),out=CATS.map(function(){return [];});
  PARTS.forEach(function(p){const i=seen[p[2]];if(i!==undefined) out[catOf(i)].push(p);});
  return out;
}
// The Components view: every component drawn in the colours of the category that brings it in, with
// what it does and a link to the first level that has it.
function partsView(){
  const seen=partFirstSeen();
  return '<p class="partsintro">Everything Iso meets in the plant, grouped by the category that brings it in. Esc goes back.</p>'+
    partsByCat().map(function(list,k){
      if(!list.length) return '';
      return '<section class="partgroup" style="--wing:'+THEMES[k].fl[3]+'"><h3>'+esc(CATS[k].name)+'<span>'+pad3(CATS[k].from)+'–'+pad3(CATS[k].to)+'</span></h3><div class="parts">'+
        list.map(function(p){
          const i=seen[p[2]];
          return '<div class="part"><canvas data-legend="'+p[0]+'" data-theme="'+k+'" width="112" height="112"></canvas><div class="ptext"><b>'+esc(p[1])+'</b><p>'+esc(p[3])+'</p>'+
            '<button type="button" class="linkbtn" data-act="play" data-lv="'+i+'">First in level '+pad3(i+1)+' · '+esc(LEVELS[i].name)+'</button></div></div>';
        }).join('')+'</div></section>';
    }).join('');
}
// Miniatures for the category cards: a window of each category's showcase level where the most kinds of
// thing are, drawn with the level's own sprites in the category's theme. Built once, kept as images.
const MINI_W=18,MINI_H=7,MINI_PX=24;
let minis=null;
function buildMinis(){
  if(minis) return minis;
  minis=CATS.map(function(cat,k){return miniOf(LEVELS[Math.min(cat.show,LEVELS.length)-1],THEMES[k]);});
  return minis;
}
// One miniature: the window of a level with the most kinds of thing in it, drawn in a theme.
function miniOf(lv,th){
  const keepTheme=theme,keepGame=game;
  try{
      let g;try{g=createGame(lv);}catch(e){return '';}
      const w=Math.min(MINI_W,g.W),h=Math.min(MINI_H,g.H);
      let best=-1,bx=0,by=0;
      for(let y0=0;y0+h<=g.H;y0++) for(let x0=0;x0+w<=g.W;x0++){
        const kinds=new Set();let n=0;
        for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++){const t=g.cells[y*g.W+x].t;if(t!==EMPTY&&t!==BASE&&t!==HARD){kinds.add(t);n++;}}
        const s=kinds.size*100+n;if(s>best){best=s;bx=x0;by=y0;}
      }
      // tileSprite reads the game being drawn (the Reactor's state, the laser phase), so lend it this one.
      setTheme(th);game=g;
      const m=document.createElement('canvas');m.width=MINI_W*MINI_PX;m.height=MINI_H*MINI_PX;
      const c=m.getContext('2d'),ox=(MINI_W-w)*MINI_PX/2,oy=(MINI_H-h)*MINI_PX/2;
      c.fillStyle=theme.vd;c.fillRect(0,0,m.width,m.height);
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){
        const cell=g.cells[(by+y)*g.W+bx+x],X=ox+x*MINI_PX,Y=oy+y*MINI_PX;
        if(cell.t===EMPTY||cell.t===INVIS) continue;
        const s=tileSprite(cell,bx+x,by+y,0);
        if(s){c.drawImage(s,X,Y,MINI_PX,MINI_PX);continue;}
        c.setTransform(MINI_PX,0,0,MINI_PX,X,Y);
        switch(cell.t){
          case MURPHY:D.iso(c,1,1000,false,0,0);break;
          case SNIK:D.gamma(c,cell.d,0);break;
          case ELEC:D.neutron(c,(bx+x)*97+(by+y)*53);break;
          case DRONE:D.drone(c,cell.d,0);break;
          case ALPHA:D.alpha(c,cell.d,0);break;
        }
        c.setTransform(1,0,0,1,0,0);
      }
      return m.toDataURL();
  }finally{game=keepGame;setTheme(keepTheme);}
}

    star(1,'Cleared')+star(STAR_FAST,'Fast · under '+fmt(parSecs(game)))+star(STAR_CHAIN,'Chain · combo ×'+chainGoal(game))+
    (save.streak>=2?'<span class="new">Streak · levels without dying</span><b class="on">×'+save.streak+'</b>':'')+'</span>';
  dialog(last?'All levels cleared':setWord()+pad3(cur+1)+' complete',tally+(last?'<br>That was the last level.':''),
    !nextOpen?[['levels','Levels'],['retry','Play again']]:[['next','Next level (Enter)'],['retry','Play again'],['levels','Levels']],'rise');
  countUp();
  // A chime for each star as it pops in, timed to the rows above it arriving.
  if(!reduceMotion) [1,STAR_FAST,STAR_CHAIN].forEach(function(bit,j){if(got&bit) SFX.star(j,(5+j)*.06+.3);});
}

/* ---------- sign-in ---------- */
// A name is all it takes: it is kept with the progress in this browser and shown on the menu. Signing in
// also loads the level file served next to the game, so the Classic set and the bonus floors are there.
function showLogin(msg){
  screen='login';clearInput();
  ov.innerHTML='<div class="panel small login"><div class="mark"><span><svg class="tre" viewBox="-1 -1 2 2" aria-hidden="true"><path d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><path transform="rotate(120)" d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><path transform="rotate(240)" d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><circle r=".18"/></svg>FISSION</span><small>Fuel the core. Don\'t go critical.</small></div>'+
    '<form class="loginform" id="loginForm" autocomplete="off"><label for="nameIn">Your name</label>'+
    '<input id="nameIn" maxlength="24" spellcheck="false" autocapitalize="words" value="'+esc(save.name||'')+'">'+
    '<button type="submit" class="btn primary">Sign in</button></form>'+
    (msg?'<p class="err">'+esc(msg)+'</p>':'')+'</div>';
  ov.hidden=false;
  const f=$('nameIn');if(f) try{f.focus({preventScroll:true});}catch(e){}
}
ov.addEventListener('submit',function(e){
  if(e.target.id!=='loginForm') return;
  e.preventDefault();
  const name=$('nameIn').value.replace(/[~<>]/g,'').trim().slice(0,24);
  if(!name){showLogin('Enter a name to sign in.');return;}
  save.name=name;persist();audioInit();
  const b=e.target.querySelector('button');b.disabled=true;b.textContent='Loading levels…';
  fetchDat().then(function(){showMenu();});
});
// The access code opens every level. It is checked as it is typed; nothing is sent anywhere.
function codeField(){
  if(save.unlocked) return '<p class="code done">Access code accepted · every level is open</p>';
  return '<label class="code">Access code<input id="codeIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="enter a code"></label>';
}
ov.addEventListener('input',function(e){
  if(e.target.id!=='codeIn') return;
  if(e.target.value.trim().toLowerCase()!==ACCESS_CODE) return;
  save.unlocked=true;persist();
  audioInit();sfxPan=0;SFX.online();
  showMenu();
});
ov.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');if(!b) return;
  audioInit();sfxPan=0;SFX.ui();
  if(b.dataset.act==='cat'||b.dataset.act==='cats'||b.dataset.act==='mirror') SFX.whoosh();
  switch(b.dataset.act){
    case 'lv':{const w=b.dataset.set;if(w&&w!==set){set=w;save.set=set;persist();}startLevel(+b.dataset.lv);break;}
    case 'retry':restart();break;
    case 'next':startLevel(Math.min(L().length-1,cur+1));break;
    case 'levels':showMenu();break;
    case 'resume':resume();break;
    case 'back':resumeGame();break;
    case 'signout':save.name='';persist();showLogin();break;
    case 'set':set=b.dataset.set;save.set=set;datError='';persist();cur=0;menuView='levels';menuCat=-1;showMenu();break;
    case 'cat':menuCat=+b.dataset.cat;showMenu('slide-l');ov.scrollTop=0;break;
    case 'cats':menuCat=-1;if(set==='mirror'){set='remake';save.set=set;persist();}showMenu('slide-r');ov.scrollTop=0;break;
    case 'continue':startLevel(firstOpen());break;
    case 'view':menuView=b.dataset.view;showMenu();ov.scrollTop=0;break;
    // A component's first level is a Fission level, whichever set the menu was showing.
    case 'play':if(set!=='remake'){set='remake';save.set=set;persist();}menuView='levels';startLevel(+b.dataset.lv);break;
    case 'meltdown':startMeltdown();break;
    case 'pick':datFile.value='';datFile.click();break;
    case 'forget':forgetDat();break;
  }
});
datFile.addEventListener('change',function(){if(datFile.files&&datFile.files[0]) loadDat(datFile.files[0]);});
addEventListener('dragover',function(e){
  if(!e.dataTransfer||Array.from(e.dataTransfer.types||[]).indexOf('Files')<0) return;
  e.preventDefault();const z=$('dropZone');if(z) z.classList.add('drag');
});
addEventListener('dragleave',function(){const z=$('dropZone');if(z) z.classList.remove('drag');});
addEventListener('drop',function(e){
  if(!e.dataTransfer||!e.dataTransfer.files||!e.dataTransfer.files.length) return;
  e.preventDefault();
  if(screen==='play') pause();
  loadDat(e.dataTransfer.files[0]);
});
$('bLevels').addEventListener('click',function(){audioInit();if(screen==='play'&&game&&game.state==='play'){clearInput();}showMenu();});
$('bRestart').addEventListener('click',function(){audioInit();restart();});
function soundLabel(){bSound.textContent=save.sound?'Sound on':'Sound off';bSound.setAttribute('aria-pressed',String(save.sound));}
bSound.addEventListener('click',function(){save.sound=!save.sound;persist();soundLabel();if(save.sound) audioInit();});
const bMusic=$('bMusic');
function musicLabel(){bMusic.textContent=Music.enabled()?'Music on':'Music off';bMusic.setAttribute('aria-pressed',String(Music.enabled()));}
function toggleMusic(){Music.toggle();musicLabel();audioInit();}
bMusic.addEventListener('click',toggleMusic);
musicLabel();

/* ---------- keyboard ---------- */
addEventListener('keydown',function(e){
  audioInit();
  if(e.target&&e.target.tagName==='INPUT') return; // typing in the code field
  const d=KEYMAP[e.code];
  const onButton=e.target&&e.target.tagName==='BUTTON';
  if(e.code==='KeyM'&&!e.repeat){toggleMusic();return;}
  if(screen==='play'){
    if(introT>0) endIntro();
    // Once Iso is gone or in the core, a fresh key goes straight to the tally.
    if(game.state!=='play'&&!e.repeat&&e.code!=='KeyR'){skipEnd();e.preventDefault();return;}
    if(d!==undefined){press(d);e.preventDefault();return;}
    if(e.code==='Space'){act=true;actTap=true;e.preventDefault();return;}
    if(e.key==='Shift'){if(!e.repeat){gad=true;gadTap=true;}e.preventDefault();return;}
    if(e.code==='KeyR'){restart();return;}
    if(e.code==='KeyP'||e.code==='Escape'){pause();e.preventDefault();return;}
  }else if(screen==='paused'){
    if(e.code==='KeyP'||e.code==='Escape'){resume();e.preventDefault();}
    else if(e.code==='KeyR') restart();
  }else if(screen==='over'){
    if(e.code==='KeyR') restart();
    else if(e.code==='Enter'&&!onButton&&mode==='meltdown') startMeltdown();
    else if(e.code==='Enter'&&!onButton&&game.state==='won'&&cur<L().length-1&&isUnlocked(set,cur+1)) startLevel(cur+1);
  }else if(screen==='menu'){
    const inCat=menuView==='levels'&&set!=='original'&&menuCat>=0;
    if(e.code==='Enter'&&!onButton){if(menuView==='meltdown') startMeltdown();else if(inCat){const nx=nextIn(menuCat);if(nx.set!==set){set=nx.set;save.set=set;persist();}startLevel(nx.i);}else if(L()) startLevel(firstOpen());}
    else if((e.code==='Escape'||e.code==='Backspace')&&inCat){menuCat=-1;if(set==='mirror'){set='remake';save.set=set;persist();}showMenu('slide-r');ov.scrollTop=0;e.preventDefault();}
    else if((e.code==='Escape'||e.code==='Backspace')&&menuView==='parts'){menuView='levels';showMenu();ov.scrollTop=0;e.preventDefault();}
    else if(e.code==='Escape'&&canResume()){resumeGame();e.preventDefault();}
  }
});
addEventListener('keyup',function(e){
  const d=KEYMAP[e.code];
  if(d!==undefined) release(d);
  if(e.code==='Space') act=false;
  if(e.key==='Shift') gad=false;
});
addEventListener('blur',function(){clearInput();pause();});
document.addEventListener('visibilitychange',function(){if(document.hidden){clearInput();pause();}});

/* ---------- touch pad ---------- */
document.querySelectorAll('.dpad button').forEach(function(b){
  const d=+b.dataset.dir;
  b.addEventListener('pointerdown',function(e){e.preventDefault();audioInit();try{b.setPointerCapture(e.pointerId);}catch(err){}press(d);b.classList.add('on');});
  const up=function(){release(d);b.classList.remove('on');};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
});
const bAct=$('bAct');
bAct.addEventListener('pointerdown',function(e){e.preventDefault();audioInit();try{bAct.setPointerCapture(e.pointerId);}catch(err){}act=true;actTap=true;bAct.classList.add('on');});
['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){bAct.addEventListener(ev,function(){act=false;bAct.classList.remove('on');});});
bGad.addEventListener('pointerdown',function(e){e.preventDefault();audioInit();try{bGad.setPointerCapture(e.pointerId);}catch(err){}gad=true;gadTap=true;bGad.classList.add('on');});
['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){bGad.addEventListener(ev,function(){gad=false;bGad.classList.remove('on');});});
// Swipe on the board: drag a finger (or the mouse) 24 px and Iso walks that way until it lifts, turning
// as the drag turns; a quick tap on one of his four neighbours snaps at it.
(function(){
  let sw=null;
  cv.addEventListener('pointerdown',function(e){
    if(screen!=='play') return;
    audioInit();if(introT>0) endIntro();
    if(game&&game.state!=='play'){skipEnd();return;}
    sw={x:e.clientX,y:e.clientY,t:performance.now(),dir:-1};
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  cv.addEventListener('pointermove',function(e){
    if(!sw) return;
    const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
    if(Math.hypot(dx,dy)<24) return;
    const d=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);
    if(d!==sw.dir){if(sw.dir>=0) release(sw.dir);press(d);sw.dir=d;}
    sw.x=e.clientX;sw.y=e.clientY;
  });
  const end=function(){
    if(!sw) return;
    const s=sw;sw=null;
    if(s.dir>=0){release(s.dir);return;}
    if(performance.now()-s.t>250||!game||screen!=='play') return;
    const r=cv.getBoundingClientRect(),tx=Math.floor((s.x-r.left)/(TS*zoom)+cam.x),ty=Math.floor((s.y-r.top)/(TS*zoom)+cam.y);
    for(let d=0;d<4;d++) if(tx===game.m.x+DX[d]&&ty===game.m.y+DY[d]){tapDir=d;actTap=true;break;}
  };
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
})();

/* ---------- loop ---------- */
function doStep(){
  const live=screen==='play'&&game.state==='play';
  const inp=live?sample():{dir:-1,act:false};
  const got=game.got,red=game.red;
  wasFalling.clear();for(const c of game.cells) if(c.f) wasFalling.add(c);
  step(game,inp);
  noteMotion(game);
  {const mc=at(game,game.m.x,game.m.y);walkStreak=mc.t===MURPHY&&mc.mt===game.tick&&(mc.ox||mc.oy)?walkStreak+1:0;}
  noteBlasts(game);
  noteHeat(game);
  scoreTick(game,got,red);
  if(got<game.need&&game.got>=game.need&&game.state==='play') reactorOnline();
  if(mode==='meltdown'&&live) meltTick(game,got);
  if(combo&&game.tick-comboTick>COMBO_TICKS) combo=0;
  if(game.got>got) eatT=performance.now();
  if(game.m.snapTick===game.tick&&game.state==='play'){snaps.push({x:game.m.x,y:game.m.y,d:game.m.snapDir,t:performance.now()});SFX.zap();}
  // How near the nearest hunter is, for the score's pulse.
  {let best=99;const g=game;for(let i=0;i<g.cells.length;i++){const t=g.cells[i].t;if(t===SNIK||t===ELEC||t===DRONE||t===ALPHA){const d=Math.abs(i%g.W-g.m.x)+Math.abs(((i/g.W)|0)-g.m.y);if(d<best) best=d;}}dangerLvl=clamp((7-best)/5,0,1);}
  const seen={};
  for(const ev of game.events){
    if(seen[ev]) continue;seen[ev]=1;
    sfxPan=panAt(game.m.x); // most sounds come from where Iso is; a blast from where it went off
    if(ev==='locked'){if(game.tick-lastLocked<4) continue;lastLocked=game.tick;toast('The Reactor starts after '+game.need+' Pellets. '+Math.max(0,game.need-game.got)+' to go.',2500);}
    if(ev==='exitlost') toast('The Reactor was destroyed. Press R to restart.',6000);
    if(ev==='gravon'||ev==='gravoff') toast(ev==='gravon'?'Gravity on':'Gravity off',1800);
    if(ev==='boom'){jolt(.3,450);freeze(70);buzz(30);const bl=blasts[blasts.length-1];if(bl) sfxPan=panAt(bl.x);}
    if(ev==='thud'){jolt(.07,160);buzz(10);}
    if(ev==='die') noteDeath();
    if(ev==='win'){flash('rgba(79,184,255,.35)');ignite(game.m.x,game.m.y);jolt(.25,500);SFX.ignite();buzz([20,40,20,40,80]);}
    if(ev==='gadget'&&game.gadget) toast(GADGET_NAME[game.gadget.k]+' ×'+game.gadget.n+' · '+GADGET_HINT[game.gadget.k],4500);
    if(ev==='doorlocked'){if(game.tick-lastLocked<4) continue;lastLocked=game.tick;toast('A blast door. It opens for a Keycard.',2500);}
    if(ev==='shield') toast('Shield up: it takes one hit for you.',3000);
    if(ev==='shieldlost'){shieldLostT=performance.now();jolt(.25,350);freeze(60);flash('rgba(79,184,255,.3)');burst(game.m.x,game.m.y,'#9fdcff');}
    if(ev==='stasis'){flash('rgba(79,184,255,.25)');toast('Stasis · '+(STASIS_TICKS/8)+' s',1500);}
    if(ev==='dash'){jolt(.1,200);burst(game.m.x,game.m.y,'#9fdcff');}
    if(ev==='tele'){flash('rgba(224,139,255,.3)');burst(game.m.x,game.m.y,'#efc4ff');cam.set=false;}
    if(ev==='eat'){const m=game.m,sn=m.snapTick===game.tick;spawnChips(sn?m.x+DX[m.snapDir]:m.x,sn?m.y+DY[m.snapDir]:m.y);chompT=performance.now();if(chompT-lastBuzz>250){lastBuzz=chompT;buzz(5);}}
    // The airlock Iso just came through sits halfway back along his two-cell hop.
    if(ev==='port'&&!reduceMotion){const mc=at(game,game.m.x,game.m.y);if(mc.mt===game.tick) trans.set((game.m.y+mc.oy/2)*game.W+game.m.x+mc.ox/2,{k:'port',t:performance.now(),ms:PORT_MS});}
    if(ev==='door'){jolt(.08,200);if(!reduceMotion){const mc=at(game,game.m.x,game.m.y);trans.set(game.m.y*game.W+game.m.x,{k:'door',t:performance.now(),ms:DOOR_MS,ax:!!mc.ox});}}
    if(ev==='gatelocked'){if(game.tick-lastLocked<4) continue;lastLocked=game.tick;toast('A gate. Something has to throw a switch.',2500);}
    if(ev==='switch'){jolt(.06,200);gateFlipT=performance.now();}
    if(ev==='crystal') toast('The coolant has set: it is Graphite now.',3000);
    if(ev==='anti'){flash('rgba(224,139,255,.25)');toast('Antipellet: one Pellet lost.',2000);}
    if(ev==='iodine') toast('Iodine: the dose is cleared and held off for '+(IODINE_TICKS/8)+' s.',3000);
    if(ev==='dosed') toast('The dose was lethal. Keep off the Fallout, or find Iodine.',6000);
    if(ev==='acid') toast('Dissolved. Acid takes anything that falls in, Iso included.',6000);
    if(ev==='suffocate') toast('The suit ran out of air.',6000);
    if(ev==='air') toast('Air tank: +'+(AIR_TANK/8)+' s.',2000);
    if(ev==='lamp') toast('Lamp: the light reaches further.',2500);
    if(ev==='shot'){jolt(.12,200);for(const mk of game.marks) if(mk.k==='shot'&&mk.cells.length){const v=mk.cells[0].x===game.m.x;shots.push({cells:mk.cells,v:v,t:performance.now()});burst(mk.cells[mk.cells.length-1].x,mk.cells[mk.cells.length-1].y,'#8fd3ff');}}
    if(ev==='tunnel'){flash('rgba(224,139,255,.25)');burst(game.m.x,game.m.y,'#efc4ff');}
    if(SFX[ev]) SFX[ev]();
  }
  // A step onto open floor: a soft footfall, unless the tick already made its own sound.
  if(walkStreak>0&&game.state==='play'&&!seen.eat&&!seen.slide&&!seen.port&&!seen.tele&&!seen.dash&&!seen.collect){sfxPan=panAt(game.m.x);SFX.step();}
  if(game.state==='dead'&&game.tick-game.endTick===12&&screen==='play') showDead();
  // The tally waits nine ticks, so most of the ignition plays before it covers the floor.
  if(game.state==='won'&&game.tick-game.endTick===9&&screen==='play'){if(mode==='meltdown') meltRoundClear();else showWon();}
  hud();
}
function frame(now){
  requestAnimationFrame(frame);
  dt=Math.min(.25,(now-(last||now))/1000);last=now;
  // Behind the pause blur, one frame in three is plenty.
  if(screen==='paused'&&(++frameNo%3)) return;
  const inIntro=introT>0&&now-introT<INTRO_MS;
  if(introT>0&&!inIntro) endIntro();
  if(game&&(screen==='play'||screen==='over')&&now>=freezeUntil&&!inIntro){ // hit-stop: the clock waits, the picture does not
    // After a death or at the finale the clock runs slow, so the moment can be seen.
    const rate=!reduceMotion&&screen==='play'&&game.state!=='play'?.6:1;
    acc+=dt*1000*rate;
    let n=0;
    while(acc>=TICK&&n<4){acc-=TICK;doStep();n++;}
    if(n===4) acc=0;
  }else if(inIntro) acc=0;
  render(now);hudTween();
  const mood=!game||screen==='menu'?0:screen!=='play'?3:game.state==='play'&&game.got>=game.need?2:1;
  Music.tick(mood,game&&screen==='play'?{heat:game.need>0?Math.min(1,game.got/game.need):1,danger:dangerLvl}:null);
}

function boot(data){
  soundLabel();resize();
  if('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
  else addEventListener('resize',resize);
  drawLegend(document.querySelector('.bar'));
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){sprites.clear();if(screen==='menu') drawLegend();drawLegend(document.querySelector('.bar'));});
  if(save.name&&!datLevels) fetchDat().then(function(ok){if(ok&&screen==='menu') showMenu();});
  if(data&&data.set&&(data.set==='remake'||datLevels)) set=data.set;
  if(data&&typeof data.level==='number'&&L()&&data.level>=0&&data.level<L().length&&data.screen==='play') startLevel(data.level);
  else showMenu();
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot) hot.snapshot(function(){return {level:cur,screen:screen,set:set};});}catch(e){}
if(hot&&hot.ready) hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
