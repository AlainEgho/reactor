<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fission</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen console - status strip on top, scrolling reactor-floor playfield, touch pad below on phones; menus float over the playfield */
:root{
  --void:#05070a;
  --bg:#0a0d12;
  --panel:#11161e;
  --line:#232b38;
  --fg:#e3e7ee;
  --muted:#8b94a5;
  --hero:#f5c518;
  --hero-soft:rgba(245,197,24,.16);
  --fuel:#86f06a;
  --core:#4fb8ff;
  --alarm:#e5402f;
  --go:#4fd27a;
  --amber:#f2b23a;
  --scrim:rgba(5,7,10,.82);
  --display:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.16em}
.logo{display:inline-flex;align-items:center;gap:.4em}
.tre{width:.95em;height:.95em;fill:var(--hero);flex:none}
.lvl{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stats{display:flex;gap:22px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
#sScore{color:var(--hero)}
.combo{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;background:var(--hero);color:#16140c;font-size:12px;font-weight:700;vertical-align:middle;animation:combo .25s ease-out}
@keyframes combo{from{transform:scale(1.6)}to{transform:scale(1)}}
.lv .meta b{color:var(--hero);font-weight:600}
.total{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.total b{color:var(--hero);font-size:16px;letter-spacing:0;font-variant-numeric:tabular-nums}
.tally{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:center;font-size:13px;color:var(--muted);text-align:left}
.tally b{color:var(--fg);font-variant-numeric:tabular-nums;text-align:right}
.tally .sum b{color:var(--hero);font-size:18px}
.tally .new{color:var(--fuel)}
.tally b.on{color:var(--hero)}
.tally b.off{color:var(--line)}
.stars{letter-spacing:.04em;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}
.stars i.on{color:var(--hero)}
#sNeed{color:var(--fuel)}
#sNeed.open{color:var(--core)}
#sTime.low{color:var(--alarm);animation:blink .6s steps(2) infinite}
@keyframes blink{to{opacity:.35}}
.meltcard h3{font-family:var(--display);font-size:20px;letter-spacing:.08em;margin:0;color:var(--alarm)}
.meltcard p b{color:var(--fg)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--hero);border-color:var(--hero);color:#16140c}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.stage{position:relative;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--void)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--scrim);overflow:auto}
.panel{width:100%;max-width:780px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px}
.panel.small{max-width:420px;align-items:center;text-align:center}
.panel h2{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.08em;margin:0;text-wrap:balance}
.panel p{margin:0;line-height:1.55;color:var(--muted);font-size:13px;max-width:60ch}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mark{display:flex;flex-direction:column;gap:4px}
.mark span{font-family:var(--display);font-size:clamp(34px,7vw,54px);font-weight:700;letter-spacing:.2em;line-height:1}
.mark span{display:inline-flex;align-items:center;gap:.3em}
.mark small{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lv{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:2px;align-items:baseline;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;min-width:0}
.lv:hover{border-color:var(--hero)}
.lv .num{grid-row:span 2;font-family:var(--display);font-size:24px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.lv.cleared .num{color:var(--go)}
.lv .name{font-size:14px;font-weight:600;min-width:0}
.lv .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.levels.dense{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.levels.dense .lv{padding:9px 11px;column-gap:9px}
.levels.dense .num{font-size:18px}
.levels.dense .name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:9px;background:var(--bg);align-self:flex-start;flex-wrap:wrap}
.tab{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:6px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.loadcard{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:18px;border:1px dashed var(--line);border-radius:10px;background:var(--bg)}
.loadcard.drag{border-color:var(--amber)}
.loadcard code{font-family:var(--mono);color:var(--fg)}
.err{color:var(--alarm);font-size:12px}
.loadcard .fine{font-size:11px;color:var(--muted);opacity:.8}
.setbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:11px;color:var(--muted)}
.linkbtn{font-family:var(--mono);font-size:11px;background:none;border:0;padding:0;color:var(--amber);text-decoration:underline;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.legend canvas{width:26px;height:26px;border-radius:4px}
.keys{font-size:11px;color:var(--muted);letter-spacing:.02em;margin:0;line-height:1.5}
.keys kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--fg)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:12px;line-height:1.45;color:var(--fg);pointer-events:none;transition:opacity .5s}
.toast.gone{opacity:0}
.pad{display:none}
@media (pointer:coarse){
  .pad{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .app>.keys{display:none}
}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px}
.dpad button{border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button.on,.act.on{background:var(--line)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.act{width:86px;height:86px;border-radius:50%;border:2px solid var(--hero);background:var(--hero-soft);color:var(--fg);font-size:11px;letter-spacing:.1em;text-transform:uppercase;touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:560px){
  .stats{gap:16px}
  .stat .v{font-size:17px}
  .logo{font-size:18px}
  .panel{padding:18px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="logo"><svg class="tre" viewBox="-1 -1 2 2" aria-hidden="true"><path d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><path transform="rotate(120)" d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><path transform="rotate(240)" d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><circle r=".18"/></svg>FISSION</span><span class="lvl" id="lvlName">Level 001</span></div>
    <div class="stats">
      <div class="stat"><span class="k">Pellets needed</span><span class="v" id="sNeed">000</span></div>
      <div class="stat"><span class="k">Score</span><span class="v" id="sScore">0<b class="combo" id="sCombo" hidden>×2</b></span></div>
      <div class="stat" id="redStat" hidden><span class="k">Red canisters</span><span class="v" id="sRed">0</span></div>
      <div class="stat"><span class="k">Time</span><span class="v" id="sTime">0:00</span></div>
      <div class="stat" id="gravStat" hidden><span class="k">Gravity</span><span class="v" id="sGrav">Off</span></div>
    </div>
    <div class="tools">
      <button class="btn" id="bLevels" type="button">Levels</button>
      <button class="btn" id="bRestart" type="button">Restart</button>
      <button class="btn" id="bSound" type="button" aria-pressed="true">Sound on</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Fission playfield"></canvas>
    <div class="toast gone" id="toast"></div>
    <div class="overlay" id="ov" hidden></div>
  </main>
  <input type="file" id="datFile" accept=".dat,.DAT,.d00,.sp,.SP" hidden>
  <div class="pad" id="pad">
    <div class="dpad">
      <button class="u" type="button" data-dir="0" aria-label="Up">&#9650;</button>
      <button class="l" type="button" data-dir="3" aria-label="Left">&#9664;</button>
      <button class="r" type="button" data-dir="1" aria-label="Right">&#9654;</button>
      <button class="d" type="button" data-dir="2" aria-label="Down">&#9660;</button>
    </div>
    <button class="act" id="bAct" type="button">Snap<br>/ Drop</button>
  </div>
  <p class="keys"><kbd>Arrows</kbd> or <kbd>WASD</kbd> move &middot; <kbd>Space</kbd> + direction snaps without moving &middot; hold <kbd>Space</kbd> to drop a red canister &middot; <kbd>R</kbd> restart &middot; <kbd>P</kbd> pause</p>
</div>

function cell(t){return {t:t,d:0,f:false,s:-1,mt:-1,ox:0,oy:0,timer:0,leave:EMPTY,phase:0,v:0,sp:null};}
const WALL=cell(HARD); // out-of-bounds sentinel, never written

// Original Supaplex level files (LEVELS.DAT): 1536 bytes per level, 60x24 tile codes, then a 96-byte
// header. The player supplies the file; nothing from it is stored in this page.
const DAT_LEVEL=1536,DAT_W=60,DAT_H=24;
const DAT_CODE=[
  [EMPTY],[ZONK],[BASE],[MURPHY],[INFO],[RAM],[HARD],[EXIT],[ORANGE],
  [PORT,2],[PORT,4],[PORT,8],[PORT,1],[PORT,2],[PORT,4],[PORT,8],[PORT,1],
  [SNIK],[YELLOW],[TERM],[RED],[PORT,5],[PORT,10],[PORT,15],[ELEC],[BUG],
  [RAM,0,1],[RAM,0,2],
  [HARD,0,1],[HARD,0,2],[HARD,0,3],[HARD,0,4],[HARD,0,5],[HARD,0,6],[HARD,0,7],[HARD,0,8],[HARD,0,9],[HARD,0,10],
  [RAM,0,3],[RAM,0,4],[INVIS]
];
function parseDat(bytes){
  if(!bytes||bytes.length<DAT_LEVEL||bytes.length%DAT_LEVEL!==0) throw new Error('A level file holds whole 1536-byte levels. This file is '+(bytes?bytes.length:0)+' bytes.');
  const out=[];
  for(let o=0;o<bytes.length;o+=DAT_LEVEL){
    const h=o+DAT_W*DAT_H;
    let name='';
    for(let i=6;i<29;i++) name+=String.fromCharCode(bytes[h+i]);
    name=name.replace(/^[-\s]+|[-\s]+$/g,'').replace(/\s+/g,' ')||'Level '+(out.length+1);
    const specials=[];
    for(let i=0;i<Math.min(10,bytes[h+31]);i++){
      const e=h+32+i*6,pos=((bytes[e]<<8)|bytes[e+1])>>1;
      specials.push({x:pos%DAT_W,y:Math.floor(pos/DAT_W),grav:bytes[e+2]===1,freezeZ:bytes[e+3]===2,freezeE:bytes[e+4]===1});
    }
    out.push({name:name,need:bytes[h+30],grav:bytes[h+4]===1,freezeZ:bytes[h+29]===2,specials:specials,
      W:DAT_W,H:DAT_H,codes:bytes.subarray?bytes.subarray(o,h):bytes.slice(o,h)});
  }
  return out;
}

function createGame(level){
  const fromDat=!!level.codes;
  const H=fromDat?level.H:level.map.length,W=fromDat?level.W:level.map[0].length;
  const g={W:W,H:H,cells:new Array(W*H),tick:0,need:level.need,got:0,red:0,total:0,state:'play',endTick:-1,
    pending:[],events:[],marks:[],m:{x:-1,y:-1,face:1,bomb:0,snapTick:-9,snapDir:1},pushTicks:0,pushDir:-1,holdTicks:0,termTick:-99,

  for(let y=0;y<H;y++){

    if(row&&row.length!==W) throw new Error(level.name+': row '+y+' is '+row.length+' wide, expected '+W);
    for(let x=0;x<W;x++){
      let c;
      if(fromDat){

function at(g,x,y){return (x<0||y<0||x>=g.W||y>=g.H)?WALL:g.cells[y*g.W+x];}
function put(g,x,y,c){g.cells[y*g.W+x]=c;}

function shift(g,x,y,nx,ny){

  c.s=g.tick;c.mt=g.tick;c.ox=x-nx;c.oy=y-ny;return c;
}
function queue(g,x,y,info,delay){
  for(const p of g.pending) if(p.x===x&&p.y===y) return;

function kill(g){

  g.state='dead';g.endTick=g.tick;g.m.bomb=0;emit(g,'die');

function explode(g,cx,cy,info){
  emit(g,'boom');
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const x=cx+dx,y=cy+dy;
    if(x<0||y<0||x>=g.W||y>=g.H) continue;
    const c=at(g,x,y);
    if(c.t===HARD||c.t===INVIS) continue;
    if(c.t===EXIT&&!g.exitLost){g.exitLost=true;emit(g,'exitlost');}
    if(c.t===MURPHY) kill(g);
    if(c.t===SNIK) g.marks.push({k:'kill',x:x,y:y});
    if(!dx&&!dy&&info) g.marks.push({k:'fission',x:x,y:y});
    if(dx||dy){
      if(c.t===ORANGE||c.t===YELLOW||c.t===BOMB||c.t===SNIK||c.t===MURPHY) queue(g,x,y,false,1);
      else if(c.t===ELEC) queue(g,x,y,true,1);

function terminal(g){

  g.termTick=g.tick;emit(g,'terminal');
  let n=0;
  for(let y=0;y<g.H;y++) for(let x=0;x<g.W;x++)
    if(g.cells[y*g.W+x].t===YELLOW) queue(g,x,y,false,1+(n++%3));

function walk(g,nx,ny){
  const m=g.m,c=at(g,m.x,m.y);
  let left=cell(EMPTY);
  if(m.bomb>0){left=cell(BOMB);left.timer=m.bomb;left.s=g.tick;m.bomb=0;}
  put(g,m.x,m.y,left);put(g,nx,ny,c);
  c.s=g.tick;c.mt=g.tick;c.ox=m.x-nx;c.oy=m.y-ny;
  m.x=nx;m.y=ny;

function push(g,x,y,c,d,need){
  if(c.f){g.pushTicks=0;return;}
  if(g.pushDir!==d){g.pushDir=d;g.pushTicks=0;}
  if(++g.pushTicks<need) return;
  const tx=x+DX[d],ty=y+DY[d];
  if(at(g,tx,ty).t!==EMPTY) return;
  shift(g,x,y,tx,ty);walk(g,x,y);g.pushTicks=0;emit(g,'push');
}

function snap(g,x,y,c){

    case BASE:put(g,x,y,cell(EMPTY));emit(g,'eat');break;
    case BUG:if(bugLive(g,c)) explode(g,g.m.x,g.m.y,false);else{put(g,x,y,cell(EMPTY));emit(g,'eat');}break;
    case INFO:g.got++;put(g,x,y,cell(EMPTY));emit(g,'collect');break;
    case RED:g.red++;put(g,x,y,cell(EMPTY));emit(g,'collect');break;
    case TERM:terminal(g);break;
  }
}

function eatable(c){return c.t===BASE||c.t===BUG||c.t===INFO||c.t===RED;}

// holds him in place, which is the only way to climb or to cross a gap.
function moveMurphy(g,inp){
  const m=g.m;
  if(m.bomb>0&&--m.bomb===0){explode(g,m.x,m.y,false);return;}
  const d=inp.dir;
  const loose=g.grav&&at(g,m.x,m.y+1).t===EMPTY;
  if(d<0){
    g.pushTicks=0;
    if(loose){g.holdTicks=0;walk(g,m.x,m.y+1);return;}
    if(inp.act){
      if(++g.holdTicks>=2&&g.red>0&&m.bomb===0){g.red--;m.bomb=BOMB_FUSE;emit(g,'arm');}
    }else g.holdTicks=0;
    return;
  }
  g.holdTicks=0;
  if(d===1||d===3) m.face=d;
  const nx=m.x+DX[d],ny=m.y+DY[d],c=at(g,nx,ny);
  if(inp.act){g.pushTicks=0;m.snapTick=g.tick;m.snapDir=d;snap(g,nx,ny,c);return;}
  if(loose&&d!==2&&!eatable(c)){g.pushTicks=0;walk(g,m.x,m.y+1);return;}
  if(g.grav&&d===0&&c.t===EMPTY) return;
  if(c.t!==ZONK&&c.t!==ORANGE&&c.t!==YELLOW) g.pushTicks=0;
  switch(c.t){
    case EMPTY:walk(g,nx,ny);break;
    case BASE:walk(g,nx,ny);emit(g,'eat');break;
    case BUG:walk(g,nx,ny);if(bugLive(g,c)) explode(g,nx,ny,false);else emit(g,'eat');break;
    case INFO:g.got++;walk(g,nx,ny);emit(g,'collect');break;
    case RED:g.red++;walk(g,nx,ny);emit(g,'collect');break;
    case EXIT:
      if(g.got>=g.need){walk(g,nx,ny);g.state='won';g.endTick=g.tick;emit(g,'win');}
      else emit(g,'locked');
      break;
    case TERM:terminal(g);break;
    case ZONK:case ORANGE:if(d===1||d===3) push(g,nx,ny,c,d,c.t===ZONK?2:1);break;
    case YELLOW:push(g,nx,ny,c,d,1);break;
    case PORT:
      if(c.d&(1<<d)){
        const tx=nx+DX[d],ty=ny+DY[d],tc=at(g,tx,ty);

            g.grav=c.sp.grav;g.freezeZ=c.sp.freezeZ;g.freezeE=c.sp.freezeE;
          }
        }
      }
      break;
    case SNIK:case ELEC:explode(g,m.x,m.y,false);break;
  }
}

function fall(g,x,y,c){
  if(c.t===ZONK&&g.freezeZ) return;
  const below=at(g,x,y+1);
  if(below.t===EMPTY){shift(g,x,y,x,y+1);c.f=true;return;}
  if(c.f){
    c.f=false;
    if(below.t===MURPHY||below.t===SNIK){explode(g,x,y+1,false);return;}
    if(below.t===ELEC){explode(g,x,y+1,true);return;}
    if(c.t===ORANGE){explode(g,x,y,false);return;}
    if(below.t===ORANGE){explode(g,x,y+1,false);return;}
    emit(g,'thud');
  }
  if(c.t===ORANGE||!isRound(below)) return;
  if(at(g,x-1,y).t===EMPTY&&at(g,x-1,y+1).t===EMPTY){shift(g,x,y,x-1,y);c.f=true;return;}
  if(at(g,x+1,y).t===EMPTY&&at(g,x+1,y+1).t===EMPTY){shift(g,x,y,x+1,y);c.f=true;}
}

// Snik Snaks and Electrons move the same way: they hug the wall on their left.
function crawl(g,x,y,c){
  if(g.freezeE) return;
  const pref=(c.d+3)%4;
  const go=function(dir){
    const nx=x+DX[dir],ny=y+DY[dir],t=at(g,nx,ny).t;
    if(t===MURPHY){c.d=dir;explode(g,nx,ny,false);return true;}
    if(t===EMPTY){c.d=dir;shift(g,x,y,nx,ny);return true;}
    return false;
  };
  if(go(pref)||go(c.d)) return;
  c.d=(c.d+1)%4;
}

function step(g,inp){
  g.tick++;g.events.length=0;g.marks=[]; // marks: where things worth points happened this tick (display only)
  const due=[];
  g.pending=g.pending.filter(function(p){if(--p.delay>0) return true;due.push(p);return false;});
  for(const p of due) explode(g,p.x,p.y,p.info);
  if(g.state==='play') moveMurphy(g,inp);
  for(let y=g.H-1;y>=0;y--) for(let x=0;x<g.W;x++){
    const c=g.cells[y*g.W+x];
    if(c.s===g.tick) continue;
    switch(c.t){
      case ZONK:case INFO:case ORANGE:fall(g,x,y,c);break;
      case SNIK:case ELEC:crawl(g,x,y,c);break;
      case EXPL:if(--c.timer<=0) put(g,x,y,cell(c.leave));break;
      case BOMB:if(--c.timer<=0) explode(g,x,y,false);break;
    }
  }
}

// The radiation trefoil: three 60-degree blades (one pointing down) round a hub.
function trefoil(c,x,y,r,col){
  c.fillStyle=col;
  for(let k=0;k<3;k++){
    const a=Math.PI/2+k*Math.PI*2/3;
    c.beginPath();c.arc(x,y,r,a-Math.PI/6,a+Math.PI/6);c.arc(x,y,r*.3,a+Math.PI/6,a-Math.PI/6,true);c.closePath();c.fill();
  }
  circ(c,x,y,r*.18);c.fill();
}
// Canister colours: body, edge.
const CANISTER={orange:['#f08a24','#8f4706'],yellow:['#f0d23a','#8c720a'],red:['#dc3340','#7a101a']};
const D={
  // Graphite: the moderator Iso digs through, drawn as its hexagonal carbon lattice; four offsets
  // so a field of it does not tile visibly.
  graphite:function(c,v){
    c.fillStyle='#141518';c.fillRect(0,0,1,1);
    c.fillStyle='#1d1f23';c.fillRect(.03,.03,.94,.94);
    c.save();c.beginPath();c.rect(.03,.03,.94,.94);c.clip();
    c.strokeStyle='#30343b';c.lineWidth=.03;
    const ox=(v&1)*.15,oy=(v>>1)*.13;
    for(let row=-1;row<5;row++) for(let i=-1;i<4;i++){hex(c,ox+i*.45+(row&1)*.225,oy+row*.26,.15);c.stroke();}
    c.restore();
    c.fillStyle='#4a505a';
    for(let k=0;k<3;k++){circ(c,.15+rnd(v*7+k)*.7,.15+rnd(v*11+k*3)*.7,.025);c.fill();}
  },
  // Concrete: poured containment wall, bevelled, flecked with aggregate, two form-tie holes.
  concrete:function(c){
    c.fillStyle='#4b4a46';c.fillRect(0,0,1,1);
    c.fillStyle='#77756c';c.fillRect(0,0,1,.06);c.fillRect(0,0,.06,1);
    c.fillStyle='#2a2926';c.fillRect(0,.94,1,.06);c.fillRect(.94,0,.06,1);
    for(let k=0;k<16;k++){c.fillStyle=k&1?'#5d5c56':'#3c3b37';circ(c,.1+rnd(k*13.1)*.8,.1+rnd(k*7.7)*.8,.014+rnd(k*3.3)*.02);c.fill();}
    for(const x of [.27,.73]){circ(c,x,.5,.045);c.fillStyle='#2a2926';c.fill();circ(c,x-.012,.49,.02);c.fillStyle='#5d5c56';c.fill();}
  },
  // Concrete fitted with plant hardware (variants 1-10, used by classic level files).
  concreteDeco:function(c,v){
    D.concrete(c);
    const lamp=function(col){circ(c,.5,.5,.17);c.fillStyle='#1b1e24';c.fill();circ(c,.5,.5,.12);c.fillStyle=col;c.fill();circ(c,.46,.45,.04);c.fillStyle='rgba(255,255,255,.7)';c.fill();};
    const pipe=function(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);c.fillStyle='rgba(255,255,255,.25)';if(w>h) c.fillRect(x,y,w,h*.25);else c.fillRect(x,y,w*.25,h);};
    switch(v){
      case 1:rr(c,.2,.2,.6,.6,.06);c.fillStyle='#f5c518';c.fill();trefoil(c,.5,.5,.24,'#16140c');break;
      case 2:lamp('#86f06a');break;
      case 3:lamp('#4fb8ff');break;
      case 4:lamp('#ff4a3d');break;
      case 5:c.save();rr(c,.17,.17,.66,.66,.02);c.clip();c.fillStyle='#f5c518';c.fillRect(.17,.17,.66,.66);c.fillStyle='#16181d';
        for(let i=-2;i<4;i++){c.beginPath();c.moveTo(.17+i*.22,.83);c.lineTo(.28+i*.22,.83);c.lineTo(.5+i*.22,.17);c.lineTo(.39+i*.22,.17);c.closePath();c.fill();}
        c.restore();break;
      case 6:circ(c,.5,.5,.24);c.fillStyle='#2a2926';c.fill();circ(c,.5,.5,.2);c.fillStyle='#ecebe4';c.fill();
        c.strokeStyle='#dc3340';c.lineWidth=.04;c.beginPath();c.arc(.5,.5,.15,-Math.PI*.25,Math.PI*.05);c.stroke();
        c.strokeStyle='#16140c';c.lineWidth=.03;c.beginPath();c.moveTo(.5,.5);c.lineTo(.62,.38);c.stroke();break;
      case 7:rr(c,.2,.24,.6,.52,.05);c.fillStyle='#2a2926';c.fill();c.fillStyle='#77756c';for(let i=0;i<5;i++) c.fillRect(.25,.3+i*.09,.5,.04);break;
      case 8:pipe(0,.36,1,.14,'#9aa3b2');pipe(0,.56,1,.1,'#f5c518');break;
      case 9:pipe(.28,0,.12,1,'#9aa3b2');pipe(.6,0,.12,1,'#9aa3b2');break;
      case 10:pipe(0,.24,1,.11,'#f5c518');pipe(0,.45,1,.11,'#f5c518');pipe(0,.66,1,.11,'#f5c518');break;
    }
  },
  // Cask: a spent-fuel cask on its side, steel with two bands and a trefoil label. It is round,
  // so Lead rolls off it.
  cask:function(c){

    const g=c.createLinearGradient(0,.12,0,.88);
    g.addColorStop(0,'#c7ced8');g.addColorStop(.45,'#7d8796');g.addColorStop(1,'#323843');
    rr(c,.08,.14,.84,.72,.2);c.fillStyle=g;c.fill();
    c.fillStyle='rgba(20,24,30,.55)';c.fillRect(.27,.14,.06,.72);c.fillRect(.67,.14,.06,.72);
    circ(c,.5,.5,.15);c.fillStyle='#f5c518';c.fill();trefoil(c,.5,.5,.12,'#16140c');
  },
  // Two-tile Casks: 1 left / 2 right half lying flat, 3 top / 4 bottom half standing.
  caskHalf:function(c,v){

    const g=horiz?c.createLinearGradient(0,.12,0,.88):c.createLinearGradient(.12,0,.88,0);
    g.addColorStop(0,'#c7ced8');g.addColorStop(.45,'#7d8796');g.addColorStop(1,'#323843');

    if(v===1) rr(c,.08,.14,1.4,.72,.2);else if(v===2) rr(c,-.48,.14,1.4,.72,.2);
    else if(v===3) rr(c,.14,.08,.72,1.4,.2);else rr(c,.14,-.48,.72,1.4,.2);
    c.fillStyle=g;c.fill();
    c.fillStyle='rgba(20,24,30,.55)';

    else if(v===3) c.fillRect(.14,.3,.72,.06);else c.fillRect(.14,.64,.72,.06);

    if(v===2||v===4){const x=v===2?.22:.5,y=v===2?.5:.22;circ(c,x,y,.13);c.fillStyle='#f5c518';c.fill();trefoil(c,x,y,.1,'#16140c');}
  },
  // Lead: a heavy lead ball with its atom on the face: a nucleus of red protons and pale neutrons,
  // electrons circling it on three tilted orbits. f (0..11) is the orbit phase; electrons behind
  // the nucleus are drawn first.
  lead:function(c,f){
    const t0=(f||0)/12*Math.PI*2,orbits=[0,Math.PI/3,Math.PI*2/3],rx=.33,ry=.1,back=[],front=[];
    const ball=c.createRadialGradient(.36,.34,.04,.5,.5,.46);
    ball.addColorStop(0,'#c3ccd7');ball.addColorStop(.5,'#6b7584');ball.addColorStop(1,'#232930');
    circ(c,.5,.5,.42);c.fillStyle=ball;c.fill();
    c.strokeStyle='rgba(225,236,255,.45)';c.lineWidth=.018;
    orbits.forEach(function(o,i){
      c.beginPath();c.ellipse(.5,.5,rx,ry,o,0,Math.PI*2);c.stroke();
      const t=t0*(i===1?-1:1)+i*Math.PI*2/3,ex=Math.cos(t)*rx,ey=Math.sin(t)*ry;
      const p=[.5+ex*Math.cos(o)-ey*Math.sin(o),.5+ex*Math.sin(o)+ey*Math.cos(o)];
      (Math.sin(t)<0?back:front).push(p);
    });
    const electron=function(p){circ(c,p[0],p[1],.045);c.fillStyle='rgba(170,225,255,.5)';c.fill();circ(c,p[0],p[1],.026);c.fillStyle='#ffffff';c.fill();};
    c.globalAlpha=.55;back.forEach(electron);c.globalAlpha=1;
    const pts=[[0,0]];
    for(let k=0;k<6;k++) pts.push([Math.cos(k*Math.PI/3+.3)*.068,Math.sin(k*Math.PI/3+.3)*.068]);
    const proton=[1,0,1,0,1,1,0];
    pts.map(function(p,i){return [p[0],p[1],proton[i]];}).sort(function(a,b){return a[1]-b[1];}).forEach(function(p){
      const x=.5+p[0],y=.5+p[1],g=c.createRadialGradient(x-.014,y-.014,.003,x,y,.048);
      if(p[2]){g.addColorStop(0,'#ffb3a6');g.addColorStop(.5,'#e5402f');g.addColorStop(1,'#7a1a10');}
      else{g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#b8c3d0');g.addColorStop(1,'#4f5a68');}
      circ(c,x,y,.046);c.fillStyle=g;c.fill();
    });
    front.forEach(electron);
  },
  // Lead under Iso's push: the ball glows red-hot with the force on it, a red halo round it.
  // k (0..1) fades out after the last push.
  leadHeat:function(c,k){
    const h=c.createRadialGradient(.5,.5,.3,.5,.5,.52);
    h.addColorStop(0,'rgba(255,70,40,'+(.45*k)+')');h.addColorStop(1,'rgba(255,40,20,0)');
    circ(c,.5,.5,.52);c.fillStyle=h;c.fill();
    const g=c.createRadialGradient(.38,.36,.04,.5,.5,.44);
    g.addColorStop(0,'rgba(255,190,160,'+(.55*k)+')');g.addColorStop(.5,'rgba(235,50,30,'+(.6*k)+')');g.addColorStop(1,'rgba(120,10,5,'+(.7*k)+')');
    circ(c,.5,.5,.42);c.fillStyle=g;c.fill();
  },
  // Pellet: a uranium fuel pellet, a green cylinder with a trefoil, glowing softly and now and then
  // giving off a faint ring and a particle. f (0..7) is the pulse phase.
  pellet:function(c,f){
    f=f||0;
    const pulse=.5+.5*Math.sin(f/8*Math.PI*2);
    const a=c.createRadialGradient(.5,.53,.05,.5,.53,.46);
    a.addColorStop(0,'rgba(134,240,106,'+(.35+.12*pulse)+')');a.addColorStop(1,'rgba(134,240,106,0)');
    circ(c,.5,.53,.46);c.fillStyle=a;c.fill();
    const s=f/8;
    circ(c,.5,.53,.24+s*.22);c.strokeStyle='rgba(180,255,150,'+((1-s)*.3)+')';c.lineWidth=.02;c.stroke();
    const g=c.createLinearGradient(.28,0,.72,0);
    g.addColorStop(0,'#2b7d25');g.addColorStop(.45,'#b4ff8c');g.addColorStop(1,'#25661f');
    c.fillStyle=g;c.fillRect(.28,.34,.44,.38);
    c.beginPath();c.ellipse(.5,.72,.22,.08,0,0,Math.PI);c.fill();
    c.beginPath();c.ellipse(.5,.34,.22,.08,0,0,Math.PI*2);c.fillStyle='#ecffe0';c.fill();
    c.strokeStyle='#4fa83f';c.lineWidth=.025;c.stroke();
    c.globalAlpha=.7;trefoil(c,.5,.56,.1,'#1f4a17');c.globalAlpha=1;
    for(let i=0;i<2;i++){
      const s=((f+i*4)%8)/8,ang=i*Math.PI+.7,d=.26+s*.2;
      c.fillStyle='rgba(234,255,217,'+((1-s)*.55)+')';circ(c,.5+Math.cos(ang)*d,.53+Math.sin(ang)*d,.018);c.fill();
    }
  },
  // Canister: a steel isotope canister with a coloured shell and a trefoil label;
  // the colour says what sets it off.
  canister:function(c,col){
    rr(c,.32,.07,.36,.11,.03);c.fillStyle='#c9ced6';c.fill();

  // Airlock: a hatch plate with a yellow hand-wheel; the arrows say which way Iso may pass.

  reactor:function(c,open){

    if(open){const g=c.createRadialGradient(.5,.5,.02,.5,.5,.36);g.addColorStop(0,'rgba(159,220,255,.9)');g.addColorStop(1,'rgba(79,184,255,0)');circ(c,.5,.5,.36);c.fillStyle=g;c.fill();}

  reactorGlow:function(c,now){

  },
  // Iso: a round droid in a hazard-yellow shell, visor band with one green scanning eye,
  // a trefoil on its front, antenna. rad (0..1) is how much fuel it has eaten: the green aura,
  // the rim and the particles circling it grow with it. burst (1..0) is the flash of the last bite.
  iso:function(c,face,now,busy,rad,burst){
    rad=rad||0;burst=burst||0;
    if(rad>0){
      const r=.48+.2*rad,pulse=.75+.25*Math.sin(now/170);
      const a=c.createRadialGradient(.5,.55,.2,.5,.55,r);
      a.addColorStop(0,'rgba(134,240,106,'+(.5*rad*pulse)+')');a.addColorStop(1,'rgba(134,240,106,0)');
      circ(c,.5,.55,r);c.fillStyle=a;c.fill();
    }
    if(burst>0){circ(c,.5,.55,.42+(1-burst)*.5);c.strokeStyle='rgba(190,255,160,'+(burst*.85)+')';c.lineWidth=.03+.05*burst;c.stroke();}
    c.strokeStyle='#9aa3b2';c.lineWidth=.035;c.beginPath();c.moveTo(.5,.16);c.lineTo(.5,.05);c.stroke();
    circ(c,.5,.05,.045);c.fillStyle=(now%900)<450?'#86f06a':'#1f4a17';c.fill();
    const g=c.createRadialGradient(.38,.36,.04,.5,.54,.44);
    g.addColorStop(0,'#fff6c2');g.addColorStop(.45,'#f5c518');g.addColorStop(1,'#6e5200');
    circ(c,.5,.55,.39);c.fillStyle=g;c.fill();
    rr(c,.17,.42,.66,.18,.09);c.fillStyle='#141008';c.fill();
    const lx=face===3?-.16:face===1?.16:0;

    eye.addColorStop(0,'#f0ffe6');eye.addColorStop(.5,'#86f06a');eye.addColorStop(1,'rgba(134,240,106,0)');
    c.fillStyle=eye;circ(c,.5+lx,.51,.09);c.fill();
    trefoil(c,.5,.76,.075,busy&&Math.floor(now/80)%2?'#2b7d25':'#16140c');
    if(rad>0){
      circ(c,.5,.55,.39);c.strokeStyle='rgba(134,240,106,'+(.25+.6*rad)+')';c.lineWidth=.03;c.stroke();
      const n=1+Math.round(rad*5);

        const a=now/400+i*Math.PI*2/n,d=.47+.04*Math.sin(now/150+i);

  // Gamma: a violet wave packet travelling head first, wobbling as it goes.
  gamma:function(c,dir,now){
    c.save();c.translate(.5,.5);c.rotate(dir*Math.PI/2);

    glow.addColorStop(0,'rgba(224,139,255,.55)');glow.addColorStop(1,'rgba(160,60,255,0)');
    c.fillStyle=glow;circ(c,0,0,.46);c.fill();

    c.restore();

  // Neutron: a bright blue particle with spinning spikes (no orbits: those belong to the Lead atom);

  neutron:function(c,now){
    c.save();c.translate(.5,.5);

    c.fillStyle=glow;circ(c,0,0,.46);c.fill();

  // Snap light: a quick beam from Iso (0,0) to the neighbouring tile in direction d, with a burst of

  snapLight:function(c,k,d){
    const tx=DX[d],ty=DY[d],fade=1-k,r=.18+.45*Math.sin(Math.min(1,k*2.2)*Math.PI/2);
    c.lineCap='round';

    circ(c,tx,ty,r);c.fillStyle=g;c.fill();

  },
  // A small nuclear blast over a whole 3x3 explosion, drawn in tiles around the blast centre (0,0):
  // flash, shock ring, then a fireball that rises on its stem, cools to smoke and fades. k runs 0..1.
  nuke:function(c,k){
    const ease=1-Math.pow(1-k,3),heat=1-k,ground=1.2;
    c.globalAlpha=k<.75?1:(1-k)/.25;
    if(k<.2){c.globalAlpha=(1-k/.2)*.8;circ(c,0,0,.4+k*8);c.fillStyle='#fffbe8';c.fill();c.globalAlpha=1;}
    circ(c,0,0,.3+k*2.4);c.strokeStyle='rgba(255,240,200,'+(heat*.7)+')';c.lineWidth=.02+.08*heat;c.stroke();
    const capY=1-2.1*ease,capR=.5+.5*ease;
    c.beginPath();c.ellipse(0,ground,.6+ease,.18+.1*ease,0,0,Math.PI*2);c.fillStyle='rgba(120,108,98,.55)';c.fill();
    const sg=c.createLinearGradient(0,capY,0,ground);
    sg.addColorStop(0,'rgba(255,150,40,'+(.4+.6*heat)+')');sg.addColorStop(1,'rgba(110,100,92,.7)');
    c.beginPath();c.moveTo(-.22,ground);c.lineTo(-.13,capY+capR*.3);c.lineTo(.13,capY+capR*.3);c.lineTo(.22,ground);c.closePath();c.fillStyle=sg;c.fill();
    const halo=c.createRadialGradient(0,capY,capR*.4,0,capY,capR*2);

/* ---------- sprite cache ---------- */
let TS=40,DPR=1,VW=1,VH=1;
const sprites=new Map();
function spr(key,fn){
  let s=sprites.get(key);
  if(!s){
    const px=Math.max(1,Math.round(TS*DPR));
    s=document.createElement('canvas');s.width=s.height=px;
    const c=s.getContext('2d');c.scale(px,px);fn(c,px);sprites.set(key,s);
  }
  return s;
}
function tileSprite(c,x,y,now){
  switch(c.t){
    // An idle Hot spot is drawn exactly like Graphite: nothing gives it away until it flares.
    case BASE:case BUG:{const v=(x*3+y*5)&3;return spr('graphite'+v,function(k){D.graphite(k,v);});}
    case HARD:{const v=c.v;return v?spr('concrete'+v,function(k){D.concreteDeco(k,v);}):spr('concrete',D.concrete);}
    case RAM:{const v=c.v;return v?spr('cask'+v,function(k){D.caskHalf(k,v);}):spr('cask',D.cask);}
    case ZONK:{const f=reduceMotion?0:(Math.floor(now/90)+x*5+y*3)%12;return spr('lead'+f,function(k){D.lead(k,f);});}
    case INFO:{const f=reduceMotion?0:(Math.floor(now/110)+x*3+y*5)%8;return spr('pellet'+f,function(k){D.pellet(k,f);});}
    case ORANGE:return spr('orange',function(k){D.canister(k,CANISTER.orange);});
    case YELLOW:return spr('yellow',function(k){D.canister(k,CANISTER.yellow);});
    case RED:return spr('red',function(k){D.canister(k,CANISTER.red);});
    case PORT:{const m=c.d;return spr('airlock'+m,function(k){D.airlock(k,m);});}
    case TERM:{const f=Math.floor(now/350)%4;return spr('initiator'+f,function(k){D.initiator(k,f);});}
    case EXIT:{const o=game.got>=game.need;return spr('reactor'+(o?1:0),function(k){D.reactor(k,o);});}
  }
  return null;
}

function resize(){
  const r=stage.getBoundingClientRect();
  VW=Math.max(1,r.width);VH=Math.max(1,r.height);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  TS=Math.max(22,Math.min(56,Math.floor(Math.min(VW/15,VH/9))));
  sprites.clear();cam.set=false;
}

/* ---------- render ---------- */
function render(now){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#05070a';ctx.fillRect(0,0,cv.width,cv.height);
  if(!game) return;
  const g=game,p=Math.min(1,acc/TICK),tsD=TS*DPR,vw=VW/TS,vh=VH/TS;
  const mc=at(g,g.m.x,g.m.y);
  let mx=g.m.x,my=g.m.y;
  if(mc.t===MURPHY&&mc.mt===g.tick){mx+=mc.ox*(1-p);my+=mc.oy*(1-p);}
  const tx=g.W<=vw?(g.W-vw)/2:clamp(mx+.5-vw/2,0,g.W-vw);
  const ty=g.H<=vh?(g.H-vh)/2:clamp(my+.5-vh/2,0,g.H-vh);
  if(!cam.set||reduceMotion){cam.x=tx;cam.y=ty;cam.set=true;}
  else{const k=Math.min(1,dt*9);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;}
  let jx=0,jy=0; // camera shake, in tiles, taken back off at the end of the frame
  if(shake>0){const left=shakeEnd-now;if(left<=0) shake=0;else{const a=shake*Math.min(1,left/350);jx=(Math.random()*2-1)*a;jy=(Math.random()*2-1)*a;}}
  cam.x+=jx;cam.y+=jy;
  const x0=Math.max(0,Math.floor(cam.x)-1),y0=Math.max(0,Math.floor(cam.y)-1);
  const x1=Math.min(g.W-1,Math.ceil(cam.x+vw)+1),y1=Math.min(g.H-1,Math.ceil(cam.y+vh)+1);
  const PX=function(x){return Math.round((x-cam.x)*tsD);},PY=function(y){return Math.round((y-cam.y)*tsD);};
  const dyn=[];
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const c=g.cells[y*g.W+x];
    if(c.t===EMPTY||c.t===INVIS) continue;
    if(c.t===MURPHY||c.t===SNIK||c.t===ELEC||c.t===EXPL||c.t===BOMB||(c.mt===g.tick&&(c.ox||c.oy))){dyn.push([c,x,y]);continue;}
    const s=tileSprite(c,x,y,now);
    if(s){const X=PX(x),Y=PY(y);ctx.drawImage(s,X,Y,PX(x+1)-X,PY(y+1)-Y);
      if(c.t===ZONK){const k=heatAt(x,y,now);if(k>0){ctx.setTransform(tsD,0,0,tsD,X,Y);D.leadHeat(ctx,k);ctx.setTransform(1,0,0,1,0,0);}}}
    if((c.t===BUG&&bugLive(g,c))||(c.t===EXIT&&g.got>=g.need)) dyn.push([c,x,y]);
  }
  for(const it of dyn){
    const c=it[0],x=it[1],y=it[2];
    let fx=x,fy=y;
    if(c.mt===g.tick){fx+=c.ox*(1-p);fy+=c.oy*(1-p);}
    if(c.t===MURPHY&&g.m.snapTick===g.tick){const l=.2*Math.sin(p*Math.PI);fx+=DX[g.m.snapDir]*l;fy+=DY[g.m.snapDir]*l;}
    const X=(fx-cam.x)*tsD,Y=(fy-cam.y)*tsD;
    const s=(c.t===MURPHY||c.t===SNIK||c.t===ELEC||c.t===EXPL||c.t===BOMB||c.t===BUG||c.t===EXIT)?null:tileSprite(c,x,y,now);
    if(s){ctx.drawImage(s,Math.round(X),Math.round(Y),Math.round(tsD),Math.round(tsD));
      if(c.t===ZONK){const k=heatAt(x,y,now);if(k>0){ctx.setTransform(tsD,0,0,tsD,Math.round(X),Math.round(Y));D.leadHeat(ctx,k);ctx.setTransform(1,0,0,1,0,0);}}
      continue;}
    ctx.setTransform(tsD,0,0,tsD,X,Y);
    switch(c.t){
      case MURPHY:
        if(g.m.bomb>0) D.bomb(ctx,now);
        D.iso(ctx,g.m.face,now,c.mt===g.tick||g.m.snapTick===g.tick,
          g.need>0?Math.min(1,g.got/g.need):(g.got>0?1:0),clamp(1-(now-eatT)/450,0,1));
        break;
      case SNIK:D.gamma(ctx,c.d,now);break;
      case ELEC:D.neutron(ctx,now+x*97+y*53);break;
      case EXPL:D.boom(ctx,(EXPL_TICKS-c.timer+p)/EXPL_TICKS,x*13+y*7);break;
      case BOMB:D.bomb(ctx,now);break;
      case BUG:D.flare(ctx,g.tick,x,y);break;
      case EXIT:D.reactorGlow(ctx,now);break;
    }
    ctx.setTransform(1,0,0,1,0,0);
  }
  for(let i=blasts.length-1;i>=0;i--){
    // The frame time can sit a little before the blast's own time stamp, so start at zero.
    const b=blasts[i],k=Math.max(0,(now-b.t)/BLAST_MS);
    if(k>=1){blasts.splice(i,1);continue;}
    ctx.setTransform(tsD,0,0,tsD,(b.x+.5-cam.x)*tsD,(b.y+.5-cam.y)*tsD);
    D.nuke(ctx,k);
  }
  for(let i=snaps.length-1;i>=0;i--){
    const s=snaps[i],k=Math.max(0,(now-s.t)/SNAP_MS);
    if(k>=1){snaps.splice(i,1);continue;}
    ctx.setTransform(tsD,0,0,tsD,(s.x+.5-cam.x)*tsD,(s.y+.5-cam.y)*tsD);
    D.snapLight(ctx,k,s.d);
  }
  ctx.setTransform(1,0,0,1,0,0);
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i],k=(now-p.t)/POP_MS;
    if(k>=1){pops.splice(i,1);continue;}
    const X=(p.x+.5-cam.x)*tsD,Y=(p.y+.25-cam.y)*tsD-k*tsD*.9;
    ctx.globalAlpha=1-Math.max(0,k-.6)/.4;
    ctx.font='700 '+Math.round(tsD*.4)+'px '+FONT_D;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=Math.max(2,tsD*.08);ctx.strokeStyle='rgba(5,7,10,.85)';ctx.strokeText(p.text,X,Y);
    ctx.fillStyle=p.col;ctx.fillText(p.text,X,Y);
  }
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i],k=(now-b.t)/BURST_MS;
    if(k>=1){bursts.splice(i,1);continue;}
    const X=(b.x+.5-cam.x)*tsD,Y=(b.y+.5-cam.y)*tsD,r=tsD*(.15+.55*Math.sin(k*Math.PI/2));
    ctx.globalAlpha=1-k;ctx.fillStyle=b.col;
    for(let j=0;j<6;j++){const a=j*Math.PI/3+(b.t%7)/7;ctx.beginPath();ctx.arc(X+Math.cos(a)*r,Y+Math.sin(a)*r,tsD*.06*(1-k)+1,0,Math.PI*2);ctx.fill();}
  }
  const fk=(now-flashT)/320;
  if(fk<1&&flashCol){ctx.globalAlpha=1-fk;ctx.fillStyle=flashCol;ctx.fillRect(0,0,cv.width,cv.height);}
  ctx.globalAlpha=1;
  cam.x-=jx;cam.y-=jy;
}
// Snap lights, one per Space+direction, drawn from Iso to the tile it reached for.
const snaps=[],SNAP_MS=280;

/* ---------- score ---------- */
// Points are a layer over the game: the rules never read them. A pellet taken within COMBO_TICKS of
// the last one raises the combo, and each pellet pays PTS.pellet times the combo.
const PTS={pellet:100,red:50,fission:500,kill:250,clear:1000},COMBO_TICKS=16,PAR_SECS=600;
let score=0,combo=0,comboTick=-99,maxCombo=0;
// Stars: 1 cleared, 2 fast (under par), 4 chain (a combo of x5, or x need on a tiny level).
const STAR_FAST=2,STAR_CHAIN=4;
function parSecs(g){return 30+2*g.need+(g.W*g.H>=1000?60:0);}
function chainGoal(g){return Math.min(5,Math.max(1,g.need));}
function starsFor(g,secs){return 1|(secs<=parSecs(g)?STAR_FAST:0)|(maxCombo>=chainGoal(g)?STAR_CHAIN:0);}
function countBits(m){return ((m&1)?1:0)+((m&2)?1:0)+((m&4)?1:0);}
function starsHTML(m){return '<span class="stars">'+[1,2,4].map(function(b){return '<i'+((m&b)?' class="on"':'')+'>★</i>';}).join('')+'</span>';}
const pops=[],POP_MS=900; // floating "+100 ×3" labels
function award(n,x,y,label,col){score+=n;pops.push({x:x,y:y,text:(label?label+' ':'')+'+'+fmtN(n),col:col,t:performance.now()});}
function fmtN(n){return Math.round(n).toLocaleString('en-US');}
function timeBonus(secs){return Math.max(0,PAR_SECS-Math.round(secs))*5;}
// Reads this tick's pickups and marks off the game and turns them into points.
function scoreTick(g,got0,red0){
  if(g.state!=='play'&&g.state!=='won') return;
  if(g.got>got0){
    combo=g.tick-comboTick<=COMBO_TICKS?combo+1:1;comboTick=g.tick;if(combo>maxCombo) maxCombo=combo;
    for(let i=got0;i<g.got;i++) award(PTS.pellet*combo,g.m.x,g.m.y,combo>1?'×'+combo:'','#b4ff8c');
    SFX.combo(combo);
  }
  if(g.got>got0) burst(g.m.x,g.m.y,'#b4ff8c');
  if(g.red>red0) award(PTS.red,g.m.x,g.m.y,'','#ff9a8c');
  for(const mk of g.marks){
    if(mk.k==='fission'){award(PTS.fission,mk.x,mk.y,'FISSION','#9fdcff');burst(mk.x,mk.y,'#9fdcff');jolt(.2,300);}
    else if(mk.k==='kill'){award(PTS.kill,mk.x,mk.y,'','#efc4ff');burst(mk.x,mk.y,'#efc4ff');}
  }
}

/* ---------- juice ---------- */
// Camera shake, a short freeze of the clock on a blast or a death, a colour flash, and particle
// bursts. None of it runs when the player asked for reduced motion.
let shake=0,shakeEnd=0,freezeUntil=0,flashCol='',flashT=-1e9;
const bursts=[],BURST_MS=450;
function jolt(amount,ms){if(reduceMotion) return;shake=Math.max(shake,amount);shakeEnd=Math.max(shakeEnd,performance.now()+ms);}
function freeze(ms){if(!reduceMotion) freezeUntil=Math.max(freezeUntil,performance.now()+ms);}
function flash(col){flashCol=col;flashT=performance.now();}
function burst(x,y,col){if(!reduceMotion) bursts.push({x:x,y:y,col:col,t:performance.now()});}
// Counts the win tally's numbers up from zero, ticking, then plays the fanfare.
function countUp(){
  const els=Array.prototype.slice.call(ov.querySelectorAll('.tally b[data-n]'));
  if(!els.length||reduceMotion){els.forEach(function(e){e.textContent=fmtN(+e.dataset.n);});SFX.bonus();return;}
  const t0=performance.now(),dur=700;let lastTick=0;
  (function run(now){
    const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    els.forEach(function(el){el.textContent=fmtN(+el.dataset.n*e);});
    if(k<1){if(now-lastTick>55){lastTick=now;SFX.tick();}requestAnimationFrame(run);}
    else SFX.bonus();
  })(t0);
}

/* ---------- meltdown mode ---------- */
// One run against the clock on floors made up as you go. The clock is in ticks (8 per second):
// MELT_START to begin, MELT_PELLET back for every pellet, MELT_CLEAR for every floor finished. At zero
// the core blows at Iso's feet. Score carries across floors; the combo starts over on each.
const MELT_START=480,MELT_PELLET=16,MELT_CLEAR=80;
let mode='levels',menuView='levels',melt={round:0,left:0,seed:0,score:0};
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
// Draws floor `round`: all Graphite inside a Concrete border, Iso top-left, the Reactor bottom-right,
// and more of everything as the rounds go up. Gammas sleep in sealed four-cell pockets. Nothing that
// falls is ever placed over open space or over a Gamma, so the floor is still when it starts.
function genMeltdown(round,seed){
  const r=rng(seed),size=round<3?[24,11]:round<6?[32,14]:round<10?[44,18]:[60,24],W=size[0],H=size[1];
  const g=[];for(let y=0;y<H;y++){g.push([]);for(let x=0;x<W;x++) g[y].push(x===0||y===0||x===W-1||y===H-1?'#':'.');}
  const area=(W-2)*(H-2),n=function(f){return Math.round(area*f);},k=Math.min(round,12);
  const want={'*':n(.10+.008*k),'O':n(.06+.012*k),'B':round>=3?n(.015+.005*k):0,'S':round>=5?Math.min(8,1+Math.floor((round-5)/2)):0,'o':round>=7?Math.min(14,2+(round-7)):0};
  const ok=function(x,y){return g[y][x]==='.'&&(x>3||y>3)&&!(x>=W-3&&y>=H-3);};
  const place=function(ch,count){
    let placed=0;
    for(let t=0;t<count*60&&placed<count;t++){
      const x=1+Math.floor(r()*(W-2)),y=1+Math.floor(r()*(H-2));
      if(!ok(x,y)) continue;
      if(ch==='S'){
        if(x+4>=W-1) continue;
        let free=true;for(let i=0;i<4;i++) if(!ok(x+i,y)||g[y-1][x+i]!=='.'||g[y+1][x+i]!=='.') free=false;
        if(!free) continue;
        for(let i=1;i<4;i++) g[y][x+i]=' ';
        g[y][x]='S';placed++;continue;
      }
      if('O*o'.indexOf(ch)>=0&&(g[y+1][x]===' '||g[y+1][x]==='S')) continue; // a Gamma's cell empties on its first step
      g[y][x]=ch;placed++;
    }
    return placed;
  };
  place('S',want.S);place('O',want.O);place('o',want.o);place('B',want.B);
  const pellets=place('*',want['*']);
  g[1][1]='@';g[H-2][W-2]='X';
  return {name:'Round '+round,need:Math.max(1,Math.ceil(pellets*.6)),hint:'',map:g.map(function(row){return row.join('');})};
}
function startMeltdown(){
  mode='meltdown';melt={round:0,left:MELT_START,seed:(Math.random()*1e9)>>>0,score:0};
  nextRound();
  toast('Meltdown. '+(MELT_START/8)+' seconds on the clock: every Pellet adds '+(MELT_PELLET/8)+', every floor you finish adds '+(MELT_CLEAR/8)+'.',6000);
}
function nextRound(){
  melt.round++;
  game=createGame(genMeltdown(melt.round,melt.seed+melt.round*7919));game.levelSet='meltdown';game.hasRed=false;
  acc=0;cam.set=false;lastLocked=-99;blasts.length=0;snaps.length=0;pops.length=0;eatT=-1e9;heat=null;combo=0;comboTick=-99;maxCombo=0;
  score=melt.score;
  screen='play';ov.hidden=true;ov.innerHTML='';clearInput();hud();
  if(melt.round>1) toast('Round '+melt.round+' · +'+(MELT_CLEAR/8)+' s',2500);
  try{cv.focus({preventScroll:true});}catch(e){}
}
// The clock for one tick of play: counts down, pays for pellets, and blows the core at zero.
function meltTick(g,got0){
  if(g.got>got0){melt.left+=MELT_PELLET*(g.got-got0);pops.push({x:g.m.x,y:g.m.y-.7,text:'+'+(MELT_PELLET/8)+' s',col:'#9fdcff',t:performance.now()});}
  if(g.state!=='play') return;
  if(--melt.left<=0){melt.left=0;explode(g,g.m.x,g.m.y,false);toast('The core went critical.',4000);}
}
function meltRoundClear(){
  melt.left+=MELT_CLEAR;melt.score=score+500*melt.round;
  nextRound();
}
function showMeltdownOver(){
  screen='over';
  const total=score,best=save.meltScore,newBest=total>best;
  if(newBest) save.meltScore=total;
  if(melt.round>save.meltRound) save.meltRound=melt.round;
  persist();
  const tally='<span class="tally"><span>Floors reached</span><b>'+melt.round+'</b>'+
    '<span class="sum">Score</span><b class="sum" data-n="'+total+'">0</b>'+
    '<span class="'+(newBest?'new':'')+'">'+(newBest?'New best':'Best '+fmtN(best)+' · round '+save.meltRound)+'</span><b></b></span>';
  dialog('Meltdown',tally,[['meltdown','Run again (R)'],['levels','Levels']]);
  countUp();
}
function meltdownCard(){
  return '<div class="loadcard meltcard"><h3>MELTDOWN</h3>'+
    '<p>The core is overheating. <b>'+(MELT_START/8)+' seconds</b> on the clock; every Pellet adds <b>'+(MELT_PELLET/8)+' s</b>, every floor you finish adds <b>'+(MELT_CLEAR/8)+' s</b> and the next floor is bigger and nastier. One run, one score.</p>'+
    '<p class="fine">'+(save.meltScore?'Best run: <b>'+fmtN(save.meltScore)+'</b> · round '+save.meltRound:'No run yet.')+'</p>'+
    '<button type="button" class="btn primary" data-act="meltdown">Start meltdown (Enter)</button></div>';
}
function restart(){if(mode==='meltdown') startMeltdown();else startLevel(cur);}
// Mushroom clouds outlive the explosion cells under them, so they are tracked here, not in the game.
const blasts=[],BLAST_MS=1100;
let eatT=-1e9; // when Iso last ate a Pellet, for its radiation flash
// The Lead ball Iso is pushing, and when it was last pushed; it glows red-hot, fading over HEAT_MS.
let heat=null;const HEAT_MS=500;
function heatAt(x,y,now){return heat&&heat.x===x&&heat.y===y?clamp(1-(now-heat.t)/HEAT_MS,0,1):0;}
function noteHeat(g){
  const d=g.pushDir;
  if(d<0||g.state!=='play'||!(g.pushTicks>0||g.events.indexOf('push')>=0)) return;
  const x=g.m.x+DX[d],y=g.m.y+DY[d];
  if(at(g,x,y).t===ZONK) heat={x:x,y:y,t:performance.now()};
}
function noteBlasts(g){
  if(g.events.indexOf('boom')<0) return;
  const t=performance.now();
  for(let i=0;i<g.cells.length;i++){const c=g.cells[i];if(c.t===EXPL&&c.c&&c.s===g.tick) blasts.push({x:i%g.W,y:(i/g.W)|0,t:t});}
}

/* ---------- HUD ---------- */
const hudCache={};
function setText(el,key,v){if(hudCache[key]!==v){hudCache[key]=v;el.textContent=v;}}
function hud(){
  if(!game) return;
  const left=Math.max(0,game.need-game.got);
  setText(sNeed,'need',left===0?'REACTOR READY':pad3(left));
  sNeed.classList.toggle('open',left===0);
  setText(sRed,'red',String(game.red));
  redStat.hidden=!(game.hasRed||game.red>0); // most levels have no red canisters; keep the bar short
  if(hudCache.score!==score){hudCache.score=score;sScore.firstChild.nodeValue=fmtN(score);}
  const cb=combo>1?'×'+combo:'';
  if(hudCache.combo!==cb){hudCache.combo=cb;sCombo.hidden=!cb;if(cb){sCombo.textContent=cb;sCombo.style.animation='none';void sCombo.offsetWidth;sCombo.style.animation='';}}
  if(mode==='meltdown'){setText(sTime,'time',fmt(melt.left*TICK/1000));sTime.classList.toggle('low',melt.left<80);}
  else{setText(sTime,'time',fmt((game.state==='play'?game.tick:game.endTick)*TICK/1000));sTime.classList.remove('low');}
  setText(lvlName,'lvl',levelLabel(cur));
  gravStat.hidden=!game.usesGrav;
  setText(sGrav,'grav',game.grav?'On':'Off');
}
function levelLabel(i){return mode==='meltdown'?'Meltdown · Round '+melt.round:(set==='original'?'Classic ':'Level ')+pad3(i+1)+' · '+L()[i].name;}
let toastTimer=0;
function toast(msg,ms){
  toastEl.textContent=msg;toastEl.classList.remove('gone');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.add('gone');},ms||6000);
}

/* ---------- screens ---------- */
function firstOpen(){const p=prog();for(let i=0;i<L().length;i++) if(!p.done[i]) return i;return 0;}
function esc(s){return String(s).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];});}
function legendHTML(){
  return ['iso:Iso','pellet:Pellet','lead:Lead','graphite:Graphite','cask:Cask','concrete:Concrete','gamma:Gamma','neutron:Neutron','hot:Hot spot','orange:Orange canister','yellow:Yellow canister','red:Red canister','airlock:Airlock','initiator:Initiator','reactor:Reactor']
    .map(function(s){const p=s.split(':');return '<span><canvas data-legend="'+p[0]+'" width="52" height="52"></canvas>'+p[1]+'</span>';}).join('');
}
function drawLegend(){
  ov.querySelectorAll('canvas[data-legend]').forEach(function(el){
    const c=el.getContext('2d'),px=el.width,now=performance.now();
    c.setTransform(1,0,0,1,0,0);c.fillStyle='#05070a';c.fillRect(0,0,px,px);c.scale(px,px);
    switch(el.dataset.legend){
      case 'iso':D.iso(c,1,1000,false,.6,0);break;
      case 'pellet':D.pellet(c,2);break;
      case 'lead':D.lead(c,1);break;
      case 'graphite':D.graphite(c,0);break;
      case 'cask':D.cask(c);break;
      case 'concrete':D.concrete(c);break;
      case 'gamma':D.gamma(c,1,now);break;
      case 'neutron':D.neutron(c,now);break;
      case 'hot':D.graphite(c,0);D.flare(c,Math.floor(now/125),0,0);break;
      case 'orange':D.canister(c,CANISTER.orange);break;
      case 'yellow':D.canister(c,CANISTER.yellow);break;
      case 'red':D.canister(c,CANISTER.red);break;
      case 'airlock':D.airlock(c,2);break;
      case 'initiator':D.initiator(c,0);break;
      case 'reactor':D.reactor(c,true);break;
    }
  });
}
function needLabel(lv){
  const n=function(k){return k+(k===1?' Pellet':' Pellets');};
  if(lv.need) return n(lv.need);
  try{return n(createGame(lv).need);}catch(e){return '';}
}
function levelGrid(levels){
  const p=prog();
  return '<div class="levels'+(levels.length>20?' dense':'')+'">'+levels.map(function(lv,i){
    const best=p.best[i],sc=p.score[i];
    const tip=esc(lv.name)+(p.done[i]?' · best '+(best!=null?fmt(best):'')+' · stars: cleared, fast, chain':'');
    return '<button type="button" class="lv'+(p.done[i]?' cleared':'')+'" data-act="lv" data-lv="'+i+'" title="'+tip+'">'+
      '<span class="num">'+pad3(i+1)+'</span><span class="name">'+esc(lv.name)+'</span>'+
      '<span class="meta">'+(p.done[i]?starsHTML(p.stars[i]||1)+(sc!=null?' <b>'+fmtN(sc)+'</b>':best!=null?' '+fmt(best):''):needLabel(lv))+'</span></button>';
  }).join('')+'</div>';
}
function totalScore(){const s=prog().score;let t=0;for(const k in s) t+=s[k];return t;}
function totalStars(){const s=prog().stars;let t=0;for(const k in s) t+=countBits(s[k]);return t;}
function showMenu(){
  if(screen==='play') clearInput();
  screen='menu';mode='levels';
  const levels=L();
  const cleared=levels?levels.filter(function(_,i){return prog().done[i];}).length:0;
  const tabs='<div class="tabs" role="tablist">'+
    '<button type="button" class="tab" role="tab" data-act="set" data-set="remake" aria-selected="'+(menuView==='levels'&&set==='remake')+'">Fission · '+LEVELS.length+'</button>'+
    '<button type="button" class="tab" role="tab" data-act="set" data-set="original" aria-selected="'+(menuView==='levels'&&set==='original')+'">Classic'+(datLevels?' · '+datLevels.length:'')+'</button>'+
    '<button type="button" class="tab" role="tab" data-act="view" data-view="meltdown" aria-selected="'+(menuView==='meltdown')+'">Meltdown'+(save.meltScore?' · '+fmtN(save.meltScore):'')+'</button></div>';
  let body;
  if(menuView==='meltdown'){
    body=meltdownCard();
  }else if(set==='original'&&!datLevels){
    body='<div class="loadcard" id="dropZone">'+
      '<p>Play classic levels from a <code>LEVELS.DAT</code> file you own. Choose the file, or drop it here. It stays in this browser and is never uploaded.</p>'+
      '<p class="fine">Reads level files made for Supaplex. Fission is an independent game and is not affiliated with it.</p>'+
      '<button type="button" class="btn primary" data-act="pick">Load LEVELS.DAT</button>'+
      (datError?'<span class="err">'+esc(datError)+'</span>':'')+'</div>';
  }else{
    body=(set==='original'?'<div class="setbar"><span>'+esc(datName)+' · '+datLevels.length+' levels · '+cleared+' cleared'+(datKept?'':' · too large to remember, load it again next visit')+'</span>'+
        '<button type="button" class="linkbtn" data-act="pick">Use a different file</button><button type="button" class="linkbtn" data-act="forget">Forget this file</button></div>'+
        (datError?'<span class="err">'+esc(datError)+'</span>':''):'')+
      '<div class="total">Total score <b>'+fmtN(totalScore())+'</b> · <b>'+totalStars()+'</b>/'+(levels.length*3)+' <span class="stars"><i class="on">★</i></span> · fast = under par, chain = a combo of ×5</div>'+
      levelGrid(levels);
  }
  ov.innerHTML='<div class="panel">'+
    '<div class="mark"><span><svg class="tre" viewBox="-1 -1 2 2" aria-hidden="true"><path d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><path transform="rotate(120)" d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><path transform="rotate(240)" d="M.15,.26L.5,.866A1,1 0 0 1-.5,.866L-.15,.26A.3,.3 0 0 0 .15,.26Z"/><circle r=".18"/></svg>FISSION</span><small>Fuel the core. Don\'t go critical. · '+(set==='remake'?LEVELS.length+' levels · '+cleared+' cleared':'classic level set')+(save.bestStreak>=2?' · best streak '+save.bestStreak:'')+'</small></div>'+
    '<p>Guide Iso through the plant. Dig through the Graphite, collect enough fuel Pellets to start the Reactor, and keep out from under falling Lead.</p>'+
    tabs+body+
    '<div class="legend">'+legendHTML()+'</div>'+
    '<p class="keys"><kbd>Arrows</kbd> or <kbd>WASD</kbd> move · <kbd>Space</kbd> + direction snaps · hold <kbd>Space</kbd> to drop a red canister · <kbd>Enter</kbd> plays the next uncleared level</p>'+
    '</div>';
  ov.hidden=false;drawLegend();
  if(levels&&(!game||game.levelSet!==set)){cur=Math.min(cur,levels.length-1);cur=firstOpen();game=createGame(levels[cur]);game.levelSet=set;cam.set=false;hud();}
}
function dialog(title,body,buttons){
  ov.innerHTML='<div class="panel small"><h2>'+title+'</h2><p>'+body+'</p><div class="row">'+
    buttons.map(function(b,i){return '<button type="button" class="btn'+(i===0?' primary':'')+'" data-act="'+b[0]+'">'+b[1]+'</button>';}).join('')+
    '</div></div>';
  ov.hidden=false;
  const f=ov.querySelector('button');if(f) f.focus({preventScroll:true});
}
function startLevel(i){
  const levels=L();
  mode='levels';cur=i;game=createGame(levels[i]);game.levelSet=set;game.hasRed=game.cells.some(function(c){return c.t===RED;});acc=0;cam.set=false;lastLocked=-99;blasts.length=0;snaps.length=0;pops.length=0;eatT=-1e9;heat=null;score=0;combo=0;comboTick=-99;maxCombo=0;
  screen='play';ov.hidden=true;ov.innerHTML='';clearInput();hud();
  const hint=levels[i].hint||('Collect '+game.need+' Pellet'+(game.need===1?'':'s')+', then reach the Reactor.'+(game.grav?' Gravity is on.':''));
  toast(hint,7000);
  try{cv.focus({preventScroll:true});}catch(e){}
}
function pause(){
  if(screen!=='play'||game.state!=='play') return;
  screen='paused';clearInput();
  dialog('Paused',esc(levelLabel(cur)),[['resume','Resume (P)'],['retry','Restart (R)'],['levels','Levels']]);
}
function resume(){screen='play';ov.hidden=true;}
function showDead(){
  if(mode==='meltdown'){showMeltdownOver();return;}
  screen='over';
  const ended=save.streak;save.streak=0;persist();
  dialog('Iso was destroyed',esc(levelLabel(cur))+'. '+(game.got)+' of '+game.need+' Pellets collected.'+(ended>=2?' Streak ended at '+ended+'.':''),[['retry','Try again (R)'],['levels','Levels']]);
}
function showWon(){
  screen='over';
  const secs=game.endTick*TICK/1000,p=prog();
  p.done[cur]=true;
  if(p.best[cur]==null||secs<p.best[cur]) p.best[cur]=Math.round(secs);
  const bonus=timeBonus(secs),total=score+PTS.clear+bonus,newBest=p.score[cur]==null||total>p.score[cur];
  if(newBest) p.score[cur]=total;
  const got=starsFor(game,secs),had=p.stars[cur]||0;
  p.stars[cur]=had|got;
  save.streak++;if(save.streak>save.bestStreak) save.bestStreak=save.streak;
  persist();
  const last=cur===L().length-1;
  const star=function(bit,label){const on=got&bit,kept=had&bit;return '<span class="'+(on&&!kept?'new':'')+'">'+label+'</span><b class="'+(on?'on':'off')+'">'+(on?'★':'☆')+'</b>';};
  const tally='<span class="tally">'+
    '<span>Pellets and bonuses</span><b data-n="'+score+'">0</b>'+
    '<span>Reactor started</span><b data-n="'+PTS.clear+'">0</b>'+
    '<span>Time bonus · '+fmt(secs)+'</span><b data-n="'+bonus+'">0</b>'+
    '<span class="sum">Score</span><b class="sum" data-n="'+total+'">0</b>'+
    '<span class="'+(newBest?'new':'')+'">'+(newBest?'New best score':'Best '+fmtN(p.score[cur]))+'</span><b></b>'+
    star(1,'Cleared')+star(STAR_FAST,'Fast · under '+fmt(parSecs(game)))+star(STAR_CHAIN,'Chain · combo ×'+chainGoal(game))+
    (save.streak>=2?'<span class="new">Streak · levels without dying</span><b class="on">×'+save.streak+'</b>':'')+'</span>';
  dialog(last?'All levels cleared':(set==='original'?'Classic ':'Level ')+pad3(cur+1)+' complete',tally+(last?'<br>That was the last level.':''),
    last?[['levels','Levels'],['retry','Play again']]:[['next','Next level (Enter)'],['retry','Play again'],['levels','Levels']]);
  countUp();
}

ov.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');if(!b) return;
  audioInit();
  switch(b.dataset.act){
    case 'lv':startLevel(+b.dataset.lv);break;
    case 'retry':restart();break;
    case 'next':startLevel(Math.min(L().length-1,cur+1));break;
    case 'levels':showMenu();break;
    case 'resume':resume();break;
    case 'set':set=b.dataset.set;save.set=set;datError='';persist();cur=0;menuView='levels';showMenu();break;
    case 'view':menuView=b.dataset.view;showMenu();break;
    case 'meltdown':startMeltdown();break;
    case 'pick':datFile.value='';datFile.click();break;
    case 'forget':forgetDat();break;
  }
});
datFile.addEventListener('change',function(){if(datFile.files&&datFile.files[0]) loadDat(datFile.files[0]);});
addEventListener('dragover',function(e){
  if(!e.dataTransfer||Array.from(e.dataTransfer.types||[]).indexOf('Files')<0) return;
  e.preventDefault();const z=$('dropZone');if(z) z.classList.add('drag');
});
addEventListener('dragleave',function(){const z=$('dropZone');if(z) z.classList.remove('drag');});
addEventListener('drop',function(e){
  if(!e.dataTransfer||!e.dataTransfer.files||!e.dataTransfer.files.length) return;
  e.preventDefault();
  if(screen==='play') pause();
  loadDat(e.dataTransfer.files[0]);
});
$('bLevels').addEventListener('click',function(){audioInit();if(screen==='play'&&game&&game.state==='play'){clearInput();}showMenu();});
$('bRestart').addEventListener('click',function(){audioInit();restart();});
function soundLabel(){bSound.textContent=save.sound?'Sound on':'Sound off';bSound.setAttribute('aria-pressed',String(save.sound));}
bSound.addEventListener('click',function(){save.sound=!save.sound;persist();soundLabel();if(save.sound) audioInit();});

/* ---------- keyboard ---------- */
addEventListener('keydown',function(e){
  audioInit();
  const d=KEYMAP[e.code];
  const onButton=e.target&&e.target.tagName==='BUTTON';
  if(screen==='play'){
    if(d!==undefined){press(d);e.preventDefault();return;}
    if(e.code==='Space'){act=true;actTap=true;e.preventDefault();return;}
    if(e.code==='KeyR'){restart();return;}
    if(e.code==='KeyP'||e.code==='Escape'){pause();e.preventDefault();return;}
  }else if(screen==='paused'){
    if(e.code==='KeyP'||e.code==='Escape'){resume();e.preventDefault();}
    else if(e.code==='KeyR') restart();
  }else if(screen==='over'){
    if(e.code==='KeyR') restart();
    else if(e.code==='Enter'&&!onButton&&mode==='meltdown') startMeltdown();
    else if(e.code==='Enter'&&!onButton&&game.state==='won'&&cur<L().length-1) startLevel(cur+1);
  }else if(screen==='menu'){
    if(e.code==='Enter'&&!onButton){if(menuView==='meltdown') startMeltdown();else if(L()) startLevel(firstOpen());}
  }
});
addEventListener('keyup',function(e){
  const d=KEYMAP[e.code];
  if(d!==undefined) release(d);
  if(e.code==='Space') act=false;
});
addEventListener('blur',function(){clearInput();pause();});
document.addEventListener('visibilitychange',function(){if(document.hidden){clearInput();pause();}});

/* ---------- touch pad ---------- */
document.querySelectorAll('.dpad button').forEach(function(b){
  const d=+b.dataset.dir;
  b.addEventListener('pointerdown',function(e){e.preventDefault();audioInit();try{b.setPointerCapture(e.pointerId);}catch(err){}press(d);b.classList.add('on');});
  const up=function(){release(d);b.classList.remove('on');};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
});
const bAct=$('bAct');
bAct.addEventListener('pointerdown',function(e){e.preventDefault();audioInit();try{bAct.setPointerCapture(e.pointerId);}catch(err){}act=true;actTap=true;bAct.classList.add('on');});
['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){bAct.addEventListener(ev,function(){act=false;bAct.classList.remove('on');});});

/* ---------- loop ---------- */
function doStep(){
  const live=screen==='play'&&game.state==='play';
  const inp=live?sample():{dir:-1,act:false};
  const got=game.got,red=game.red;
  step(game,inp);
  noteBlasts(game);
  noteHeat(game);
  scoreTick(game,got,red);
  if(mode==='meltdown'&&live) meltTick(game,got);
  if(combo&&game.tick-comboTick>COMBO_TICKS) combo=0;
  if(game.got>got) eatT=performance.now();
  if(game.m.snapTick===game.tick&&game.state==='play'){snaps.push({x:game.m.x,y:game.m.y,d:game.m.snapDir,t:performance.now()});SFX.zap();}
  const seen={};
  for(const ev of game.events){
    if(seen[ev]) continue;seen[ev]=1;
    if(ev==='locked'){if(game.tick-lastLocked<4) continue;lastLocked=game.tick;toast('The Reactor starts after '+game.need+' Pellets. '+Math.max(0,game.need-game.got)+' to go.',2500);}
    if(ev==='exitlost') toast('The Reactor was destroyed. Press R to restart.',6000);
    if(ev==='gravon'||ev==='gravoff') toast(ev==='gravon'?'Gravity on':'Gravity off',1800);
    if(ev==='boom'){jolt(.3,450);freeze(70);}
    if(ev==='thud') jolt(.07,160);
    if(ev==='die'){jolt(.6,700);freeze(240);flash('rgba(229,64,47,.45)');}
    if(ev==='win') flash('rgba(79,184,255,.35)');
    if(SFX[ev]) SFX[ev]();
  }
  if(game.state==='dead'&&game.tick-game.endTick===12&&screen==='play') showDead();
  if(game.state==='won'&&game.tick-game.endTick===6&&screen==='play'){if(mode==='meltdown') meltRoundClear();else showWon();}
  hud();
}
function frame(now){
  requestAnimationFrame(frame);
  dt=Math.min(.25,(now-(last||now))/1000);last=now;
  if(game&&(screen==='play'||screen==='over')&&now>=freezeUntil){ // hit-stop: the clock waits, the picture does not
    acc+=dt*1000;
    let n=0;
    while(acc>=TICK&&n<4){acc-=TICK;doStep();n++;}
    if(n===4) acc=0;
  }
  render(now);
}

function boot(data){
  soundLabel();resize();
  if('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
  else addEventListener('resize',resize);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){sprites.clear();if(screen==='menu') drawLegend();});
  if(data&&data.set&&(data.set==='remake'||datLevels)) set=data.set;
  if(data&&typeof data.level==='number'&&L()&&data.level>=0&&data.level<L().length&&data.screen==='play') startLevel(data.level);
  else showMenu();
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot) hot.snapshot(function(){return {level:cur,screen:screen,set:set};});}catch(e){}
if(hot&&hot.ready) hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
